<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Earnings — Aerva</title>
<meta name="robots" content="noindex, nofollow">
<!--
  host-earnings.html — the host's money view, split out of
  host-dashboard.html so that page is purely about managing listings.
  Holds what used to be its "Your Performance" and "Your Earnings"
  sections, unchanged in behaviour: the same ?analytics=1 aggregates and
  the same per-booking payout rows, including the deposit dispute,
  host-initiated cancellation and compensation-coupon flows.

  Authenticates with the same aerva_guest_session token every other host
  page uses (see guest-auth.js) — there is no separate host login.
  Reached from index.html's account menu, directly under Status.
-->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body{font-family:'Jost', sans-serif; background:#f4ebe3; color:#1c1a17; margin:0; padding:40px 20px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px; margin:0 auto;}
  .back-home{
    display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:#1c1a17; opacity:0.6; text-decoration:none; margin-bottom:20px;
  }
  .back-home:hover{opacity:1;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}
  h1{font-family:Georgia,serif; font-size:26px; margin:0;}
  .status-badge{font-size:11px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;}
  .status-approved{background:#e3f0e5; color:#3a7d44;}
  .status-pending{background:#f5ecd7; color:#8a6c39;}
  .status-rejected{background:#f5e0da; color:#a3402f;}
  .status-draft{background:#e6e6e6; color:#555;}
  .status-paid{background:#e3f0e5; color:#3a7d44;}
  .status-refunded{background:#f5ecd7; color:#8a6c39;}
  .status-cancelled{background:#f5e0da; color:#a3402f;}
  .manage-link{font-size:12.5px; color:#8a6c39; text-decoration:underline; white-space:nowrap;}
  .empty{text-align:center; opacity:0.6; padding:60px 0;}
  .loading{text-align:center; opacity:0.6; padding:60px 0;}
  .section-heading{font-family:Georgia,serif; font-size:19px; margin:36px 0 14px;}
  /* ---- Analytics ---- */
  .an-totals{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .an-total{background:white; border:1px solid #e0d5c0; padding:12px 16px; flex:1 1 128px;}
  .an-total .an-label{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.55; display:block; margin-bottom:3px;}
  .an-total .an-value{font-size:19px; font-family:Georgia,serif;}
  .an-card{background:white; border:1px solid #e0d5c0; padding:16px 18px; margin-bottom:12px;}
  .an-card h4{margin:0 0 2px; font-size:14px; font-family:Georgia,serif;}
  .an-sub{font-size:11.5px; opacity:0.55; margin:0 0 12px;}
  .an-card svg{width:100%; height:auto; display:block; overflow:visible;}
  .an-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; opacity:0.7; margin-top:10px;}
  .an-legend span{display:flex; align-items:center; gap:5px;}
  .an-swatch{width:10px; height:10px; border-radius:2px; display:inline-block;}
  .an-empty{text-align:center; opacity:0.55; padding:26px 0; font-size:13px;}
  .an-toggle{display:flex; gap:6px; margin-bottom:12px;}
  .an-toggle button{font-size:12px; padding:5px 12px; border:1px solid #e0d5c0; background:white; cursor:pointer; font-family:inherit; color:inherit;}
  .an-toggle button.on{background:#1c1a17; color:#f4ebe3; border-color:#1c1a17;}
  .an-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .an-controls .an-toggle{margin-bottom:0;}
  .an-select{
    font-size:12px; padding:5px 10px; border:1px solid #e0d5c0; background:white;
    font-family:inherit; color:inherit; max-width:220px;
  }
  .an-clear{
    font-size:11px; margin-left:8px; padding:2px 8px; border:1px solid #e0d5c0;
    background:white; cursor:pointer; font-family:inherit; color:#8a6c39;
  }
  .an-total .an-label{display:flex; align-items:center; gap:5px;}
  .an-card svg text{user-select:none;}
  .an-bar{transition:opacity .12s ease;}
  .an-card svg:hover .an-bar{opacity:0.55;}
  .an-card svg .an-bar:hover{opacity:1 !important;}
  .an-tooltip{
    position:fixed; z-index:99; pointer-events:none; opacity:0;
    background:#1c1a17; color:#f4ebe3; font-size:11.5px; line-height:1.4;
    padding:6px 10px; border-radius:4px; white-space:nowrap;
    transition:opacity .12s ease; box-shadow:0 4px 14px rgba(28,26,23,0.22);
  }
  .an-metric button{letter-spacing:0.02em;}
  .an-card{padding:18px 20px 20px;}
  .an-card h4{font-size:13px; letter-spacing:0.04em; text-transform:uppercase; opacity:0.75; margin-bottom:3px;}
  .an-totals{gap:8px;}
  .an-total{padding:11px 14px;}
  .an-total .an-value{font-size:20px;}
  @media (max-width:640px){
    .an-controls{gap:8px;}
    .an-select{flex:1 1 140px; max-width:none;}
    .an-tooltip{display:none;}
  }
  .booking-row{background:white; border:1px solid #e0d5c0; padding:16px 20px; margin-bottom:10px;}
  .booking-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .booking-top h4{margin:0; font-size:14.5px; font-family:Georgia,serif;}
  .booking-dates{font-size:12.5px; opacity:0.65;}
  .booking-figures{display:flex; gap:24px; flex-wrap:wrap; font-size:12.5px; margin-top:8px;}
  .booking-figures .figure-label{opacity:0.55; text-transform:uppercase; letter-spacing:0.05em; font-size:10px; display:block; margin-bottom:2px;}
  .booking-figures .figure-value{font-size:14px;}
  .payout-value{color:#3a7d44; font-weight:600;}
  .deposit-row{margin-top:12px; padding-top:12px; border-top:1px solid #f0e6d6;}
  .deposit-status-badge{font-size:10.5px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em; margin-left:8px;}
  .deposit-status-held{background:#f5ecd7; color:#8a6c39;}
  .deposit-status-disputed{background:#f5e0da; color:#a3402f;}
  .deposit-status-refunded{background:#e3f0e5; color:#3a7d44;}
  .deposit-status-resolved{background:#e3f0e5; color:#3a7d44;}
  .sidebar-add-btn{
    background:white; border:1px dashed #ddd0bc; padding:9px; font-size:11px; letter-spacing:0.05em;
    text-transform:uppercase; cursor:pointer; width:100%; color:#8a6c39; margin-bottom:6px;
  }
  .profile-modal-body{padding:24px;}
  .profile-modal-body .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .profile-modal-body .field label{font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; opacity:0.6;}
  .profile-modal-body .field input{
    padding:11px; font-size:14px; border:1px solid #ccc; background:white; color:#1c1a17;
    font-family:'Jost', sans-serif;
  }
  .profile-modal-body .field input:disabled{background:#ebe2d4; opacity:0.7; cursor:not-allowed;}
</style>
</head>
<body>

<div class="wrap">
  <a href="host-dashboard.html" class="back-home">&larr; Back to My Collection</a>
  <div class="top-row">
    <div><h1>My Earnings</h1></div>
  </div>

  <h2 class="section-heading">Your Performance</h2>
  <div id="analyticsContainer">
    <p class="loading">Loading your analytics…</p>
  </div>

  <h2 class="section-heading">Your Earnings</h2>
  <div id="bookingsContainer">
    <p class="loading">Loading your bookings…</p>
  </div>
</div>

<script>
  const API_BASE = 'https://aerva-in.vercel.app';
  const RAZORPAY_KEY_ID = 'rzp_test_TRBdgq9nPS2wfy'; // public Key ID only — safe to expose, same key used everywhere else
  const sessionToken = localStorage.getItem('aerva_guest_session');
  if(!sessionToken) window.location.replace('guest-login.html');

  function statusBadgeHtml(status){
    return `<span class="status-badge status-${status}">${status}</span>`;
  }

  // The earnings block below calls loadListings() after a dispute,
  // cancellation or coupon purchase to pull fresh figures. On the
  // dashboard that reloaded the listing grid too; here there is no grid,
  // so it maps onto the bookings refresh alone. Kept under the original
  // name so the moved code is byte-identical to what it was and can be
  // diffed against the dashboard if anything ever looks wrong.
  function loadListings(){ return loadEarnings(); }

  async function loadEarnings(){
    const container = document.getElementById('bookingsContainer');
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        headers: { 'Authorization': 'Bearer ' + sessionToken }
      });
      if(res.status === 401){
        localStorage.removeItem('aerva_guest_session');
        window.location.replace('guest-login.html');
        return;
      }
      if(!res.ok) throw new Error('failed');
      const data = await res.json();
      renderBookings(Array.isArray(data.bookings) ? data.bookings : []);
    }catch(err){
      console.error('earnings load failed:', err);
      container.innerHTML = '<p class="empty">Could not load your bookings. Please refresh.</p>';
    }
  }

  function renderBookings(bookings){
    const container = document.getElementById('bookingsContainer');
    if(!bookings.length){
      container.innerHTML = '<p class="empty">No bookings yet.</p>';
      return;
    }
    const fmt = (n) => '₹' + Number(n).toLocaleString('en-IN');
    container.innerHTML = bookings.map(b => {
      const guestPaidForStay = Number(b.subtotal) + Number(b.gst);
      const dateRange = new Date(b.arrival).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }) +
        ' – ' + new Date(b.departure).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' });

      // Deposit section — only shown at all if this booking actually had
      // one (deposit_status defaults to 'none' for bookings on listings
      // with no security deposit set). "Raise a Concern" only appears
      // while it's still 'held' and the 7-day window hasn't closed yet —
      // the same two checks the backend enforces, so a host never sees a
      // button that would just fail when clicked.
      let depositHtml = '';
      if(b.deposit_status && b.deposit_status !== 'none'){
        const releaseDate = b.deposit_release_at ? new Date(b.deposit_release_at) : null;
        const canDispute = b.deposit_status === 'held' && releaseDate && new Date() <= releaseDate;
        const releaseLabel = releaseDate
          ? releaseDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' })
          : '';

        let statusNote = '';
        if(b.deposit_status === 'held') statusNote = `Held until ${releaseLabel} unless you raise a concern.`;
        else if(b.deposit_status === 'disputed') statusNote = 'Under review by Aerva — you\'ll hear back once it\'s resolved.';
        else if(b.deposit_status === 'refunded') statusNote = 'The 7-day window passed with no concern raised — refunded to the guest in full.';
        else if(b.deposit_status === 'resolved') statusNote = `Resolved — ${fmt(b.deposit_resolution_amount || 0)} credited toward your payout, remainder refunded to the guest.`;

        depositHtml = `
          <div class="deposit-row">
            <span class="figure-label">Security Deposit</span>
            <span class="figure-value">${fmt(b.deposit_amount)}<span class="deposit-status-badge deposit-status-${b.deposit_status}">${b.deposit_status}</span></span>
            <div class="dispute-note">${statusNote}</div>
            ${b.dispute_reason ? `<div class="dispute-reason-shown">Your note: "${b.dispute_reason}"</div>` : ''}
            ${canDispute ? `
              <button type="button" class="dispute-btn" data-order-id="${b.id}" onclick="toggleDisputeForm(${b.id})">Raise a Concern</button>
              <div class="dispute-form" id="disputeForm-${b.id}">
                <textarea id="disputeReason-${b.id}" rows="3" placeholder="What happened? (damage, missing items, extra cleaning needed, etc.)"></textarea>
                <button type="button" class="btn-small" onclick="submitDispute(${b.id})">Submit</button>
                <p class="verify-error" id="disputeError-${b.id}"></p>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Cancellation — only offered while the booking is still 'paid'
      // (not already cancelled) and check-in is more than 48 hours away.
      // Same two checks the backend enforces, so a host never sees a
      // button that would just fail when clicked.
      const CANCELLATION_CUTOFF_HOURS = 48;
      const hoursUntilArrival = (new Date(b.arrival + 'T00:00:00Z').getTime() - Date.now()) / (1000 * 60 * 60);
      const canCancel = b.status === 'paid' && hoursUntilArrival >= CANCELLATION_CUTOFF_HOURS;
      let cancellationHtml = '';
      if(b.status === 'cancelled'){
        cancellationHtml = `
          <div class="deposit-row">
            <span class="deposit-status-badge deposit-status-rejected">Cancelled</span>
            ${b.cancellation_reason ? `<div class="dispute-reason-shown">Reason: "${b.cancellation_reason}"</div>` : ''}
          </div>
        `;
      } else if(canCancel){
        cancellationHtml = `
          <div class="deposit-row">
            <button type="button" class="dispute-btn" onclick="toggleCancelForm(${b.id})">Cancel This Booking</button>
            <div class="dispute-form" id="cancelForm-${b.id}">
              <p style="font-size:12.5px; opacity:0.7; margin-bottom:8px;">This refunds the guest in full and cannot be undone. Only available more than 48 hours before check-in.</p>
              <textarea id="cancelReason-${b.id}" rows="3" placeholder="Why are you cancelling this booking?"></textarea>
              <button type="button" class="btn-small" onclick="submitCancellation(${b.id})">Confirm Cancellation</button>
              <p class="verify-error" id="cancelError-${b.id}"></p>
            </div>
          </div>
        `;
      } else if(b.status === 'paid'){
        cancellationHtml = `<div class="deposit-row"><p style="font-size:12px; opacity:0.55;">This stay checks in within 48 hours — no longer cancellable from here. Contact hello@aerva.in if urgent.</p></div>`;
      }

      // Prioritizing a bigger booking: the guest must already have a
      // coupon before this cancellation is even allowed — same 48-hour
      // eligibility as a plain cancellation, plus this is genuinely a
      // separate action, not an alternative reason on the same button,
      // since it requires paying for and confirming a coupon first.
      let swapHtml = '';
      if(canCancel){
        swapHtml = `
          <div class="deposit-row">
            <button type="button" class="dispute-btn" onclick="toggleSwapForm(${b.id})">Prioritize a Bigger Booking</button>
            <div class="dispute-form" id="swapForm-${b.id}">
              <p style="font-size:12.5px; opacity:0.7; margin-bottom:8px;">To cancel this booking in favor of a bigger one, you must first buy this guest a compensation coupon — paid by you to Aerva, then issued to the guest. Only once that's confirmed can this booking actually be cancelled.</p>
              <div id="swapStep1-${b.id}">
                <label style="font-size:12.5px;">Coupon amount (₹)</label>
                <input type="number" id="swapAmount-${b.id}" min="1" placeholder="e.g. ${Math.round(Number(b.subtotal) * 0.10)}" style="width:100%; padding:8px; margin:6px 0 10px; box-sizing:border-box;">
                <button type="button" class="btn-small" onclick="buyCoupon(${b.id})">Pay &amp; Issue Coupon</button>
              </div>
              <div id="swapStep2-${b.id}" style="display:none; margin-top:10px;">
                <p style="font-size:12.5px; color:#3a7d44;">✓ Coupon issued and emailed to the guest.</p>
                <button type="button" class="dispute-btn" style="border-color:#a3402f; color:#a3402f;" onclick="confirmSwapCancellation(${b.id})">Now Cancel This Booking</button>
              </div>
              <p class="verify-error" id="swapError-${b.id}"></p>
            </div>
          </div>
        `;
      }

      // Real pet species, not just a headcount — see create-order.js's
      // validation and the guest-facing picker in index.html that
      // collects this. Only shown when the guest actually declared any.
      const petTypesHtml = (Array.isArray(b.pet_types) && b.pet_types.length)
        ? `<div class="booking-dates" style="opacity:0.75;">🐾 ${b.pet_types.join(', ')}</div>`
        : '';

      return `
        <div class="booking-row">
          <div class="booking-top">
            <h4>${b.suite_name}</h4>
            ${statusBadgeHtml(b.status)}
          </div>
          <div class="booking-dates">${dateRange} · ${b.nights} night${b.nights === 1 ? '' : 's'}${b.guests ? ' · ' + b.guests + ' guest' + (b.guests === 1 ? '' : 's') : ''}</div>
          ${petTypesHtml}
          <div class="booking-figures">
            <div><span class="figure-label">Guest Paid (Stay)</span><span class="figure-value">${fmt(guestPaidForStay)}</span></div>
            <div><span class="figure-label">Commission (${b.commission_rate}%)</span><span class="figure-value">− ${fmt(b.commission_amount)}</span></div>
            <div><span class="figure-label">Your Payout</span><span class="figure-value payout-value">${fmt(b.payout_amount)}</span></div>
          </div>
          ${depositHtml}
          ${cancellationHtml}
          ${swapHtml}
        </div>
      `;
    }).join('');
  }

  function toggleDisputeForm(orderId){
    const form = document.getElementById('disputeForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function submitDispute(orderId){
    const reasonEl = document.getElementById('disputeReason-' + orderId);
    const errorEl = document.getElementById('disputeError-' + orderId);
    errorEl.style.display = 'none';
    const reason = reasonEl.value.trim();
    if(!reason){
      errorEl.textContent = 'Please describe the concern first.';
      errorEl.style.display = 'block';
      return;
    }
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ raiseDispute: { orderId, reason } })
      });
      const data = await res.json();
      if(res.ok){
        loadListings();
      } else {
        errorEl.textContent = data.error || 'Could not submit your concern. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch(err){
      errorEl.textContent = 'Could not submit your concern. Please try again.';
      errorEl.style.display = 'block';
    }
  }

  function toggleCancelForm(orderId){
    const form = document.getElementById('cancelForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function submitCancellation(orderId){
    const reasonEl = document.getElementById('cancelReason-' + orderId);
    const errorEl = document.getElementById('cancelError-' + orderId);
    errorEl.style.display = 'none';
    const reason = reasonEl.value.trim();
    if(!reason){
      errorEl.textContent = 'Please explain why you\'re cancelling.';
      errorEl.style.display = 'block';
      return;
    }
    // Real money movement, and irreversible — a confirm dialog is the
    // safety check here, same reasoning as admin.html's deposit actions.
    if(!confirm('This will cancel the booking and refund the guest in full. This cannot be undone. Continue?')) return;
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ cancelBooking: { orderId, reason } })
      });
      const data = await res.json();
      if(res.ok){
        loadListings();
      } else {
        errorEl.textContent = data.error || 'Could not cancel this booking. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch(err){
      errorEl.textContent = 'Could not cancel this booking. Please try again.';
      errorEl.style.display = 'block';
    }
  }

  function toggleSwapForm(orderId){
    const form = document.getElementById('swapForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  // Step 1: host pays Aerva for the coupon — a genuinely different kind
  // of Razorpay transaction than everything else on this site (host is
  // the one paying, not a guest). Same create-order-then-verify pattern
  // used throughout the app, just with host-listings.js's coupon-specific
  // modes instead of create-order.js/verify-payment.js.
  async function buyCoupon(bookingId){
    const amountEl = document.getElementById('swapAmount-' + bookingId);
    const errorEl = document.getElementById('swapError-' + bookingId);
    errorEl.textContent = '';
    const amount = Number(amountEl.value);
    if(!amount || amount <= 0){
      errorEl.textContent = 'Please enter a valid coupon amount.';
      return;
    }

    let orderData;
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ buyCouponOrder: { bookingId, amount } })
      });
      orderData = await res.json();
      if(!res.ok){
        errorEl.textContent = orderData.error || 'Could not start the coupon payment.';
        return;
      }
    } catch(err){
      errorEl.textContent = 'Could not reach the server. Please try again.';
      return;
    }

    if(typeof Razorpay === 'undefined'){
      errorEl.textContent = 'Payment gateway did not load. Please check your connection and try again.';
      return;
    }

    const options = {
      key: RAZORPAY_KEY_ID,
      order_id: orderData.razorpayOrderId,
      amount: orderData.amount,
      currency: orderData.currency,
      name: 'Aerva',
      description: 'Guest compensation coupon',
      theme: { color: '#a9884f' },
      handler: async function(response){
        try{
          const verifyRes = await fetch(API_BASE + '/api/host-listings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
            body: JSON.stringify({
              verifyCouponPayment: {
                couponId: orderData.couponId,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
              }
            })
          });
          const verifyData = await verifyRes.json();
          if(verifyData.verified){
            document.getElementById('swapStep1-' + bookingId).style.display = 'none';
            document.getElementById('swapStep2-' + bookingId).style.display = 'block';
          } else {
            errorEl.textContent = verifyData.error || 'Could not verify the coupon payment. Please contact hello@aerva.in.';
          }
        } catch(err){
          errorEl.textContent = 'Payment went through, but could not be confirmed automatically. Please contact hello@aerva.in.';
        }
      }
    };
    const rzp = new Razorpay(options);
    rzp.on('payment.failed', function(response){
      errorEl.textContent = 'Payment failed: ' + response.error.description;
    });
    rzp.open();
  }

  // Step 2: now that the coupon exists (confirmed by the backend, not
  // just assumed from the UI state), the actual cancellation can happen.
  async function confirmSwapCancellation(orderId){
    const errorEl = document.getElementById('swapError-' + orderId);
    errorEl.textContent = '';
    if(!confirm('This will cancel the booking and refund the guest in full — the coupon has already been issued as compensation. This cannot be undone. Continue?')) return;
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ cancelWithCoupon: { orderId } })
      });
      const data = await res.json();
      if(res.ok){
        loadListings();
      } else {
        errorEl.textContent = data.error || 'Could not cancel this booking. Please try again.';
      }
    } catch(err){
      errorEl.textContent = 'Could not cancel this booking. Please try again.';
    }
  }

  // ================= ANALYTICS =================
  // One fetch (?analytics=1) returns the raw grain — one row per
  // month × listing × timing bucket. Every control below is a different
  // grouping of those same rows, done in memory, so switching a filter
  // or clicking a month bar is instant and never re-queries.
  //
  // Bars are hand-built inline SVG rather than a charting library:
  // nothing else on this page loads a third-party script, and an SVG
  // with a viewBox and no fixed width scales itself on a phone.

  // Two buckets, not three. The host is paid in full at booking time, so
  // every rupee here has already landed — what differs is whether the
  // STAY has been delivered yet. 'Upcoming' is therefore revenue already
  // banked against nights still owed, which is the forecast a host cares
  // about, not money still to arrive.
  const AN_BUCKETS = [
    { key:'current',  label:'Stays delivered', color:'#3a7d44' },
    { key:'upcoming', label:'Still to deliver', color:'#c2b49a' }
  ];
  const AN_MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  let anData = null;                 // whole payload from the server
  let anYear = null;                 // a year number, or 'compare'
  let anType = 'all';                // all | stay | experience
  let anListingId = 'all';           // 'all' or a listing id
  let anSelectedMonth = null;        // 'YYYY-MM' when a bar is clicked
  let anStatus = 'paid';             // paid | all | cancelled | refunded
  let anMetric = 'payout';           // payout | bookings

  // Axis maximum, rounded UP to a clean number with headroom above the
  // tallest bar. Scaling exactly to the data made the biggest bar touch
  // the top of the plot with its value label clipped against the frame,
  // and produced gridline labels like ₹137.4k.
  function anNiceMax(raw){
    const data = Math.max(raw, 1);
    // Booking counts are whole things — a gridline reading "1.2 bookings"
    // is nonsense — so round up to a multiple of 4, which is how many
    // gridline intervals the charts draw.
    if(anMetric === 'bookings'){
      return Math.max(4, Math.ceil((data * 1.12) / 4) * 4);
    }
    const v = data * 1.10;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    // A fine ladder on purpose. A coarse one (1, 2, 5, 10) turned 90,000
    // into an axis topping out at 200,000, leaving every bar under half
    // height and the chart looking empty. Each of these divides into four
    // readable gridline steps.
    const ladder = [1, 1.2, 1.4, 1.6, 1.8, 2, 2.4, 3, 4, 5, 6, 8, 10];
    const step = ladder.find(x => n <= x) || 10;
    return step * mag;
  }
  function anFmt(v){ return anMetric === 'bookings' ? String(Math.round(v)) : anMoney(v); }
  function anFmtFull(v){ return anMetric === 'bookings' ? Math.round(v) + (Math.round(v)===1?' booking':' bookings') : anMoneyFull(v); }

  // Listing names are host-supplied text going into markup. Same rule as
  // the message renderers in index.html — escape before it reaches
  // innerHTML, or a property named with an <img onerror=...> runs script.
  function anEsc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function anMoney(n){
    const v = Number(n) || 0;
    if(v >= 10000000) return '₹' + (v/10000000).toFixed(2).replace(/\.00$/,'') + 'Cr';
    if(v >= 100000)   return '₹' + (v/100000).toFixed(2).replace(/\.00$/,'') + 'L';
    if(v >= 1000)     return '₹' + (v/1000).toFixed(1).replace(/\.0$/,'') + 'k';
    return '₹' + v.toLocaleString('en-IN');
  }
  function anMoneyFull(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN'); }
  // Built from the string, never through new Date(), so a month label
  // can't shift by one in a negative-offset timezone.
  function anMonthLabel(key){ return AN_MONTHS[Number(key.slice(5,7)) - 1] || key; }

  // The filters, applied once. Everything downstream works off this.
  function anRows(){
    if(!anData) return [];
    return anData.rows.filter(r => {
      if(anType !== 'all' && r.listingType !== anType) return false;
      if(anListingId !== 'all' && String(r.listingId) !== String(anListingId)) return false;
      if(anStatus !== 'all' && r.status !== anStatus) return false;
      return true;
    });
  }

  // 12 zeroed month slots for a year, then filled — so a month with no
  // bookings is a visible gap in the series rather than a missing bar
  // that silently shifts every later month leftwards.
  function anMonthSeries(year){
    const slots = [];
    for(let m = 1; m <= 12; m++){
      slots.push({ month: year + '-' + String(m).padStart(2,'0'),
                   current:0, upcoming:0, total:0, payout:0, bookings:0, nights:0 });
    }
    const byKey = {};
    slots.forEach(s => { byKey[s.month] = s; });
    anRows().forEach(r => {
      const s = byKey[r.month];
      if(!s) return;
      // Bars plot whichever metric is selected; bookings/nights stay
      // available alongside so the caption can report both regardless.
      const v = anMetric === 'bookings' ? r.bookings : r.payout;
      s[r.bucket] += v;
      s.total += v;
      s.payout += r.payout;
      s.bookings += r.bookings;
      s.nights += r.nights;
    });
    return slots;
  }

  function anYearTotals(year){
    const t = { current:0, upcoming:0, total:0, payout:0, bookings:0, nights:0 };
    anRows().forEach(r => {
      if(r.month.slice(0,4) !== String(year)) return;
      const v = anMetric === 'bookings' ? r.bookings : r.payout;
      t[r.bucket] += v; t.total += v;
      t.payout += r.payout; t.bookings += r.bookings; t.nights += r.nights;
    });
    return t;
  }

  // Stacked monthly bars, one stack per month, segments in past →
  // current → upcoming order so the realised money always sits at the
  // bottom and the speculative part on top.
  function anMonthChart(series){
    const W = 720, H = 210, padL = 48, padB = 26, padT = 12;
    const max = anNiceMax(Math.max(...series.map(s => Math.max(s.current, s.upcoming)), 1));
    const plotH = H - padB - padT, plotW = W - padL - 8;
    const slot = plotW / 12, bw = Math.min(slot * 0.30, 18);
    let grid = '', bars = '', labels = '';
    // Four gridlines rather than two — easier to read a mid-range bar
    // against, and the top line now sits above the tallest bar thanks to
    // anNiceMax, so nothing is flush against the frame.
    for(let g = 0; g <= 4; g++){
      const y = padT + plotH - (plotH/4)*g;
      grid += `<line x1="${padL}" y1="${y}" x2="${W-8}" y2="${y}" stroke="${g===0?'#ddd0bc':'#f3ebdd'}" stroke-width="1"></line>`;
      grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#8a7f6c">${anFmt(max*g/4)}</text>`;
    }
    series.forEach((s, i) => {
      const cx = padL + slot*i + slot/2;
      const isSel = anSelectedMonth === s.month;
      // Full-height hit area, so a month with a tiny bar (or none at all)
      // is still comfortably clickable.
      bars += `<rect class="an-hit" data-month="${s.month}" x="${cx-slot/2}" y="${padT}" width="${slot}" height="${plotH}" fill="${isSel ? 'rgba(138,108,57,0.10)' : 'transparent'}" style="cursor:pointer"></rect>`;
      // Side by side, not stacked: the two are answers to different
      // questions (money for nights already given vs nights still owed),
      // and a host compares them against each other rather than reading
      // their sum off the axis.
      AN_BUCKETS.forEach((b, bi) => {
        const v = s[b.key];
        const x = cx + (bi === 0 ? -bw - 1 : 1);
        if(v > 0){
          const h = (v/max)*plotH;
          bars += `<rect class="an-bar" data-month="${s.month}" data-tip="${anEsc(anMonthLabel(s.month) + ' ' + s.month.slice(0,4) + ' · ' + b.label + ' · ' + anFmtFull(v))}" x="${x}" y="${(padT+plotH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${b.color}" style="cursor:pointer" opacity="${anSelectedMonth && !isSel ? 0.4 : 1}"></rect>`;
        } else {
          bars += `<rect x="${x}" y="${padT+plotH-2}" width="${bw}" height="2" fill="#e8dcc8"></rect>`;
        }
      });
      labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="${isSel ? '#1c1a17' : '#8a7f6c'}" font-weight="${isSel ? '600' : '400'}" style="pointer-events:none">${anMonthLabel(s.month)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payout by month">${grid}${bars}${labels}</svg>`;
  }

  // Two years side by side, one pair of bars per month.
  function anCompareChart(yearA, yearB){
    const a = anMonthSeries(yearA), b = anMonthSeries(yearB);
    const W = 720, H = 210, padL = 48, padB = 26, padT = 12;
    const max = anNiceMax(Math.max(...a.map(s=>s.total), ...b.map(s=>s.total), 1));
    const plotH = H - padB - padT, plotW = W - padL - 8;
    const slot = plotW / 12, bw = Math.min(slot*0.30, 16);
    let grid = '', bars = '', labels = '';
    for(let g = 0; g <= 4; g++){
      const y = padT + plotH - (plotH/4)*g;
      grid += `<line x1="${padL}" y1="${y}" x2="${W-8}" y2="${y}" stroke="${g===0?'#ddd0bc':'#f3ebdd'}" stroke-width="1"></line>`;
      grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#8a7f6c">${anFmt(max*g/4)}</text>`;
    }
    for(let i = 0; i < 12; i++){
      const cx = padL + slot*i + slot/2;
      [[a[i], yearA, '#c2b49a', -1],[b[i], yearB, '#3a7d44', 1]].forEach(([s, yr, color, side]) => {
        const h = (s.total/max)*plotH;
        const x = cx + (side < 0 ? -bw-1 : 1);
        if(s.total > 0){
          bars += `<rect class="an-bar" data-tip="${anEsc(anMonthLabel(s.month) + ' ' + yr + ' · ' + anFmtFull(s.total))}" x="${x}" y="${(padT+plotH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${color}"></rect>`;
        } else {
          bars += `<rect x="${x}" y="${padT+plotH-2}" width="${bw}" height="2" fill="#e8dcc8"></rect>`;
        }
      });
      labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8a7f6c">${AN_MONTHS[i]}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Year comparison">${grid}${bars}${labels}</svg>`;
  }

  // Per-listing breakdown for whatever is currently in scope — the whole
  // year, or just the clicked month.
  function anListingBreakdown(year, monthKey){
    const agg = {};
    anRows().forEach(r => {
      if(monthKey ? r.month !== monthKey : r.month.slice(0,4) !== String(year)) return;
      const k = r.listingId;
      if(!agg[k]) agg[k] = { name:r.listingName, type:r.listingType, payout:0, gross:0, bookings:0, nights:0 };
      agg[k].payout += r.payout; agg[k].gross += r.gross;
      agg[k].bookings += r.bookings; agg[k].nights += r.nights;
    });
    const list = Object.values(agg).sort((x,y) => y.payout - x.payout);
    if(!list.length) return '<p class="an-empty">No bookings in this period.</p>';
    const max = Math.max(...list.map(l => l.payout), 1);
    const rowH = 30, W = 720, padLl = 150, padR = 86;
    const H = Math.max(list.length*rowH + 10, 40);
    const plotW = W - padLl - padR;
    let out = '';
    list.forEach((l, i) => {
      const y = i*rowH + 6;
      const w = (l.payout/max)*plotW;
      const nm = l.name && l.name.length > 22 ? l.name.slice(0,21) + '…' : (l.name || 'Untitled');
      out += `<text x="${padLl-8}" y="${y+14}" text-anchor="end" font-size="11" fill="#1c1a17">${anEsc(nm)}</text>`;
      out += `<rect class="an-bar" data-tip="${anEsc(l.name + ' · ' + anMoneyFull(l.payout) + ' · ' + l.bookings + (l.bookings===1?' booking':' bookings') + ' · ' + l.nights + (l.nights===1?' night':' nights'))}" x="${padLl}" y="${y+3}" width="${Math.max(w,2).toFixed(1)}" height="15" rx="2" fill="${l.type === 'experience' ? '#8a6c39' : '#3a7d44'}"></rect>`;
      out += `<text x="${padLl+Math.max(w,2)+7}" y="${y+15}" font-size="10" fill="#8a7f6c">${anMoney(l.payout)} · ${l.bookings} bkg</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payout by listing">${out}</svg>`;
  }

  function anTotalsStrip(t, caption){
    return `<p class="an-sub">${anEsc(caption)}</p><div class="an-totals">
      ${AN_BUCKETS.map(b => `<div class="an-total"><span class="an-label"><i class="an-swatch" style="background:${b.color}"></i>${b.label}</span><span class="an-value">${anFmt(t[b.key])}</span></div>`).join('')}
      <div class="an-total"><span class="an-label">${anMetric === 'bookings' ? 'Total bookings' : 'Total payout'}</span><span class="an-value payout-value">${anFmt(t.total)}</span></div>
    </div>`;
  }

  // A real hover tooltip. SVG <title> works but waits for the browser's
  // own ~1s delay and can't be styled, which made reading a chart feel
  // broken. This follows the pointer, and is bound after every render
  // because innerHTML replaces the nodes each time.
  function anBindTooltip(box){
    let tip = document.getElementById('anTooltip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'anTooltip';
      tip.className = 'an-tooltip';
      document.body.appendChild(tip);
    }
    const hide = () => { tip.style.opacity = '0'; };
    box.querySelectorAll('.an-bar').forEach(el => {
      el.addEventListener('mouseenter', () => {
        tip.textContent = el.getAttribute('data-tip') || '';
        tip.style.opacity = '1';
      });
      el.addEventListener('mousemove', (e) => {
        // Clamped to the viewport so a bar near the right edge doesn't
        // push the tooltip off-screen.
        const w = tip.offsetWidth || 160;
        const x = Math.min(e.clientX + 14, window.innerWidth - w - 10);
        tip.style.left = Math.max(8, x) + 'px';
        tip.style.top = (e.clientY - 34) + 'px';
      });
      el.addEventListener('mouseleave', hide);
    });
    box.addEventListener('mouseleave', hide);
  }

  function anRender(){
    const box = document.getElementById('analyticsContainer');
    if(!anData) return;
    const years = anData.years || [];
    const listings = (anData.listings || []).filter(l => anType === 'all' || l.type === anType);

    const controls = `<div class="an-controls">
      <div class="an-toggle">
        ${[['all','All'],['stay','Stays'],['experience','Experiences']].map(([v,l]) =>
          `<button type="button" data-an-type="${v}" class="${anType===v?'on':''}">${l}</button>`).join('')}
      </div>
      <div class="an-toggle">
        ${years.map(y => `<button type="button" data-an-year="${y}" class="${String(anYear)===String(y)?'on':''}">${y}</button>`).join('')}
        ${years.length === 2 ? `<button type="button" data-an-year="compare" class="${anYear==='compare'?'on':''}">Compare</button>` : ''}
      </div>
      <select class="an-select" id="anListingSelect" aria-label="Filter by listing">
        <option value="all">All listings</option>
        ${listings.map(l => `<option value="${l.id}" ${String(anListingId)===String(l.id)?'selected':''}>${anEsc(l.name)}</option>`).join('')}
      </select>
      <select class="an-select" id="anStatusSelect" aria-label="Filter by booking status">
        ${[['paid','Confirmed bookings'],['all','All bookings'],['cancelled','Cancelled only'],['refunded','Refunded only']]
          .map(([v,l]) => `<option value="${v}" ${anStatus===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <div class="an-toggle an-metric">
        ${[['payout','₹ Payout'],['bookings','# Bookings']].map(([v,l]) =>
          `<button type="button" data-an-metric="${v}" class="${anMetric===v?'on':''}">${l}</button>`).join('')}
      </div>
    </div>`;

    let body;
    if(anYear === 'compare'){
      const [yA, yB] = years;
      const tA = anYearTotals(yA), tB = anYearTotals(yB);
      const diff = tB.total - tA.total;
      const pct = tA.total > 0 ? Math.round((diff/tA.total)*100) : null;
      body = `<div class="an-card"><h4>${yA} vs ${yB}</h4>
        <p class="an-sub">Total payout per month, both years side by side.</p>
        ${anCompareChart(yA, yB)}
        <div class="an-legend">
          <span><i class="an-swatch" style="background:#c2b49a"></i>${yA} — ${anMoney(tA.total)}</span>
          <span><i class="an-swatch" style="background:#3a7d44"></i>${yB} — ${anMoney(tB.total)}</span>
          <span style="color:${diff>=0?'#3a7d44':'#a3402f'}">${diff>=0?'▲':'▼'} ${anMoney(Math.abs(diff))}${pct!==null?` (${diff>=0?'+':'−'}${Math.abs(pct)}%)`:''}</span>
        </div></div>`;
    } else {
      const series = anMonthSeries(anYear);
      const sel = anSelectedMonth && anSelectedMonth.slice(0,4) === String(anYear)
        ? series.find(s => s.month === anSelectedMonth) : null;
      const scopeTotals = sel
        ? { current:sel.current, upcoming:sel.upcoming, total:sel.total, bookings:sel.bookings, nights:sel.nights }
        : anYearTotals(anYear);
      const statusWord = { paid:'confirmed', all:'', cancelled:'cancelled', refunded:'refunded' }[anStatus];
      const scopeLabel = sel ? `${anMonthLabel(sel.month)} ${anYear}` : String(anYear);
      const caption = `${scopeLabel} — ${scopeTotals.bookings} ${statusWord ? statusWord + ' ' : ''}booking${scopeTotals.bookings===1?'':'s'}`
        + `, ${scopeTotals.nights} night${scopeTotals.nights===1?'':'s'}`
        + `, ${anMoneyFull(scopeTotals.payout)} paid out`;
      body = anTotalsStrip(scopeTotals, caption)
        + `<div class="an-card"><h4>${anMetric === 'bookings' ? 'Bookings' : 'Payout'} by booking month</h4>
           <p class="an-sub">Counted in the month you were paid, split by whether the stay has happened yet. Tap a month for its own numbers.${sel?' <button type="button" class="an-clear" id="anClearMonth">Show whole year</button>':''}</p>
           ${anMonthChart(series)}
           <div class="an-legend">${AN_BUCKETS.map(b=>`<span><i class="an-swatch" style="background:${b.color}"></i>${b.label}</span>`).join('')}</div>
           </div>`
        + `<div class="an-card"><h4>By listing${sel?' — '+anMonthLabel(sel.month)+' '+anYear:''}</h4>
           <p class="an-sub">Payout, highest first.</p>
           ${anListingBreakdown(anYear, sel ? sel.month : null)}</div>`;
    }

    box.innerHTML = controls + body;

    box.querySelectorAll('[data-an-type]').forEach(b => b.addEventListener('click', () => {
      anType = b.dataset.anType;
      // A listing filter pinned to something the new type filter hides
      // would silently produce an empty view with no obvious cause.
      const still = (anData.listings||[]).some(l => String(l.id)===String(anListingId) && (anType==='all'||l.type===anType));
      if(!still) anListingId = 'all';
      anRender();
    }));
    box.querySelectorAll('[data-an-year]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.anYear;
      anYear = v === 'compare' ? 'compare' : Number(v);
      if(anYear === 'compare') anSelectedMonth = null;
      anRender();
    }));
    const sel = document.getElementById('anListingSelect');
    if(sel) sel.addEventListener('change', () => { anListingId = sel.value; anRender(); });
    const stSel = document.getElementById('anStatusSelect');
    if(stSel) stSel.addEventListener('change', () => { anStatus = stSel.value; anRender(); });
    box.querySelectorAll('[data-an-metric]').forEach(b => b.addEventListener('click', () => {
      anMetric = b.dataset.anMetric; anRender();
    }));
    anBindTooltip(box);
    const clr = document.getElementById('anClearMonth');
    if(clr) clr.addEventListener('click', () => { anSelectedMonth = null; anRender(); });
    box.querySelectorAll('svg [data-month]').forEach(el => el.addEventListener('click', () => {
      const m = el.getAttribute('data-month');
      anSelectedMonth = (anSelectedMonth === m) ? null : m;  // click again to clear
      anRender();
    }));
  }

  async function loadAnalytics(){
    const box = document.getElementById('analyticsContainer');
    if(!box) return;
    try{
      const res = await fetch(API_BASE + '/api/host-listings?analytics=1', {
        headers: { 'Authorization': 'Bearer ' + sessionToken }
      });
      if(!res.ok) throw new Error('failed');
      const d = await res.json();
      // `rows` is the marker that this really is an analytics reply. An
      // older deployment of host-listings.js ignores ?analytics=1 and
      // falls through to its normal GET, whose payload would otherwise be
      // accepted and rendered as an empty chart rather than an error.
      if(!Array.isArray(d.rows) || !Array.isArray(d.years)){
        box.innerHTML = '<p class="an-empty">Analytics needs the latest server update. Please try again shortly.</p>';
        return;
      }
      anData = d;
      anYear = d.years[d.years.length - 1];
      if(!d.listings || !d.listings.length){
        box.innerHTML = '<p class="an-empty">Analytics appear here once you have an approved listing.</p>';
        return;
      }
      anRender();
    }catch(err){
      console.error('analytics load failed:', err);
      box.innerHTML = '<p class="an-empty">Could not load your analytics. Please refresh.</p>';
    }
  }

  loadEarnings();
  loadAnalytics();
</script>

</body>
</html>
