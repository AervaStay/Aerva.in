<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Earnings — Aerva</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f4ebe3'/><text x='50' y='68' font-family='Georgia,serif' font-size='60' text-anchor='middle' fill='%23A9885A'>A</text></svg>">
<meta name="robots" content="noindex, nofollow">
<!--
  host-earnings.html — the host's money view, split out of
  host-dashboard.html so that page is purely about managing listings.
  Holds what used to be its "Your Performance" and "Your Earnings"
  sections, unchanged in behaviour: the same ?analytics=1 aggregates and
  the same per-booking payout rows, including the deposit dispute,
  host-initiated cancellation and compensation-coupon flows.

  Authenticates with the same aerva_guest_session token every other host
  page uses (see guest-auth.js) — there is no separate host login.
  Reached from index.html's account menu, directly under Status.
-->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body{font-family:'Jost', sans-serif; background:#ffffff; color:#1c1a17; margin:0; padding:40px 20px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px; margin:0 auto;}
  .back-home{
    display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:#1c1a17; opacity:0.6; text-decoration:none; margin-bottom:20px;
  }
  .back-home:hover{opacity:1;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}
  h1{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:26px; margin:0;}
  .status-badge{font-size:11px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;}
  .status-approved{background:#e3f0e5; color:#3a7d44;}
  .status-pending{background:#f5ecd7; color:#8a6c39;}
  .status-rejected{background:#f5e0da; color:#a3402f;}
  .status-draft{background:#e6e6e6; color:#555;}
  .status-paid{background:#e3f0e5; color:#3a7d44;}
  .status-refunded{background:#f5ecd7; color:#8a6c39;}
  .status-cancelled{background:#f5e0da; color:#a3402f;}
  .manage-link{font-size:12.5px; color:#8a6c39; text-decoration:underline; white-space:nowrap;}
  .empty{text-align:center; opacity:0.6; padding:60px 0;}
  .loading{text-align:center; opacity:0.6; padding:60px 0;}
  .notice-card{border:1px solid #ddc9a3; background:#fdf6e9; border-radius:10px; padding:16px 18px; margin:0 0 14px;}
  .notice-card.notice-urgent{border-color:#a3402f; background:#fbeeea;}
  .notice-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .notice-title{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:16px; margin:0;}
  .notice-due{font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:#8a6c39;}
  .notice-card.notice-urgent .notice-due{color:#a3402f; font-weight:600;}
  .notice-body{font-size:13.5px; line-height:1.6; margin:0 0 10px; opacity:0.85;}
  .notice-action{
    display:inline-block; background:#1c1a17; color:#f4ebe3; border:none; cursor:pointer;
    padding:9px 16px; font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase;
    font-family:'Jost', sans-serif; border-radius:4px; text-decoration:none;
  }
  .section-heading{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:19px; margin:36px 0 14px;}
  /* ---- Analytics ---- */
  .an-totals{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .an-total{background:white; border:1px solid #e0d5c0; padding:12px 16px; flex:1 1 128px;}
  .an-total .an-label{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.55; display:block; margin-bottom:3px;}
  .an-total .an-value{font-size:19px; font-family:'Bodoni Moda', Georgia, serif; font-weight:500;}
  .an-card{background:white; border:1px solid #e0d5c0; padding:16px 18px; margin-bottom:12px;}
  .an-card h4{margin:0 0 2px; font-size:14px; font-family:'Bodoni Moda', Georgia, serif; font-weight:500;}
  .an-sub{font-size:11.5px; opacity:0.55; margin:0 0 12px;}
  .an-card svg{width:100%; height:auto; display:block; overflow:visible;}
  .an-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; opacity:0.7; margin-top:10px;}
  .an-legend span{display:flex; align-items:center; gap:5px;}
  .an-swatch{width:10px; height:10px; border-radius:2px; display:inline-block;}
  .an-empty{text-align:center; opacity:0.55; padding:26px 0; font-size:13px;}
  .an-toggle{display:flex; gap:6px; margin-bottom:12px;}
  .an-toggle button{font-size:12px; padding:5px 12px; border:1px solid #e0d5c0; background:white; cursor:pointer; font-family:inherit; color:inherit;}
  .an-toggle button.on{background:#1c1a17; color:#f4ebe3; border-color:#1c1a17;}
  .an-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .an-controls .an-toggle{margin-bottom:0;}
  .an-select{
    font-size:12px; padding:5px 10px; border:1px solid #e0d5c0; background:white;
    font-family:inherit; color:inherit; max-width:220px;
  }
  .an-clear{
    font-size:11px; margin-left:8px; padding:2px 8px; border:1px solid #e0d5c0;
    background:white; cursor:pointer; font-family:inherit; color:#8a6c39;
  }
  .an-total .an-label{display:flex; align-items:center; gap:5px;}
  .an-card svg text{user-select:none;}
  .an-bar{transition:opacity .12s ease;}
  .an-card svg:hover .an-bar{opacity:0.55;}
  .an-card svg .an-bar:hover{opacity:1 !important;}
  .an-tooltip{
    position:fixed; z-index:99; pointer-events:none; opacity:0;
    background:#1c1a17; color:#f4ebe3; font-size:11.5px; line-height:1.4;
    padding:6px 10px; border-radius:4px; white-space:nowrap;
    transition:opacity .12s ease; box-shadow:0 4px 14px rgba(28,26,23,0.22);
  }
  .an-metric button{letter-spacing:0.02em;}
  .an-card{padding:18px 20px 20px;}
  .an-card h4{font-size:13px; letter-spacing:0.04em; text-transform:uppercase; opacity:0.75; margin-bottom:3px;}
  .an-totals{gap:8px;}
  .an-total{padding:11px 14px;}
  .an-total .an-value{font-size:20px;}
  @media (max-width:640px){
    .an-controls{gap:8px;}
    .an-select{flex:1 1 140px; max-width:none;}
    .an-tooltip{display:none;}
  }
  /* ---- Earnings table ----
     Was one card per booking, which made the figures impossible to
     compare: the same four numbers sat in a different place on screen in
     every card, and there was no total anywhere. A table lines the money
     up in columns and can foot itself. Everything that needs room to
     breathe — the deposit, the cancellation form, the pets — moves into
     a details row that opens under the booking it belongs to. */
  .earn-scope{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;
  }
  .earn-scope .an-toggle{margin-bottom:0;}
  .earn-scope-note{font-size:12px; opacity:0.6;}
  .earn-scope-note b{font-weight:500; opacity:1;}
  .earn-from-chart{
    font-size:11.5px; padding:4px 10px; border-radius:3px;
    background:#f5ecd7; color:#8a6c39; letter-spacing:0.03em;
  }
  .earn-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;}
  .earn-table{
    width:100%; border-collapse:collapse; background:white;
    border:1px solid #e0d5c0; font-size:13px; min-width:760px;
  }
  .earn-table th{
    text-align:left; font-weight:400; font-size:10px; letter-spacing:0.06em;
    text-transform:uppercase; opacity:0.55; padding:10px 12px;
    border-bottom:1px solid #e0d5c0; white-space:nowrap;
  }
  .earn-table td{padding:11px 12px; border-bottom:1px solid #f0e6d6; vertical-align:top;}
  .earn-table tbody tr:hover{background:#fdfaf5;}
  .earn-table .num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .earn-prop{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:14px; display:block;}
  .earn-guest{font-size:11.5px; opacity:0.6;}
  .earn-when{white-space:nowrap;}
  .earn-when small{display:block; font-size:11px; opacity:0.55;}
  .payout-value{color:#3a7d44; font-weight:600;}
  .earn-more{
    background:none; border:1px solid #e0d5c0; color:#8a6c39; cursor:pointer;
    font-family:inherit; font-size:11px; padding:3px 9px; white-space:nowrap;
  }
  .earn-more[aria-expanded="true"]{background:#1c1a17; color:#f4ebe3; border-color:#1c1a17;}
  .earn-flag{font-size:11px; color:#8a6c39; display:block; margin-top:3px;}
  /* Money that fell through reads differently from money that came in:
     never green, and never looking like a payout that is owed. */
  .earn-cost{color:#a3402f;}
  .earn-lost{color:#1c1a17; opacity:0.5;}
  .earn-detail > td{background:#fdfaf5; padding:4px 12px 16px;}
  .earn-table tfoot td{
    border-top:1px solid #e0d5c0; border-bottom:none; padding:12px;
    font-size:13px; background:#fdfaf5;
  }
  .earn-table tfoot .foot-label{font-size:11px; letter-spacing:0.05em; text-transform:uppercase; opacity:0.6;}
  /* A table cannot stay a table at phone width. Each row becomes its own
     block, with the column heading carried down as a label. */
  @media (max-width:760px){
    .earn-table{min-width:0; border:none; background:none;}
    .earn-table thead{position:absolute; left:-9999px;}
    .earn-table tr{
      display:block; background:white; border:1px solid #e0d5c0;
      margin-bottom:10px; padding:12px 14px;
    }
    .earn-table td{display:block; border:none; padding:3px 0;}
    .earn-table td.num{text-align:left;}
    .earn-table td[data-label]::before{
      content:attr(data-label) '  ';
      font-size:10px; letter-spacing:0.05em; text-transform:uppercase; opacity:0.55;
      display:inline-block; min-width:118px;
    }
    .earn-table td[data-label=""]::before{content:none;}
    /* The details belong to the booking above them, so they stay inside
       the same card rather than opening a second floating box. */
    .earn-table tr.earn-detail{
      border:1px solid #e0d5c0; border-top:none; margin-top:-10px; padding:0 14px 12px;
    }
    .earn-detail > td{background:none; padding:0;}
    .earn-table tfoot tr{background:#fdfaf5;}
    .earn-table td.is-blank{display:none;}
  }
  /* Moved with this section out of host-dashboard.html, where these rules
     stayed behind — without them every dispute and cancellation form on
     this page sat permanently open, and the button that should reveal one
     appeared to do nothing on the first click. */
  .dispute-btn{
    background:none; border:1px solid #a3402f; color:#a3402f; padding:6px 14px;
    font-size:13px; cursor:pointer; margin-top:8px; font-family:inherit;
  }
  .dispute-form{margin-top:10px; display:none;}
  .dispute-form textarea{
    width:100%; box-sizing:border-box; border:1px solid #ddd0bc; padding:8px 10px;
    font-family:'Jost', sans-serif; font-size:14px; resize:vertical; margin-bottom:8px;
  }
  .dispute-note{font-size:13.5px; opacity:0.65; margin-top:6px;}
  .dispute-reason-shown{font-size:14px; opacity:0.75; margin-top:6px; font-style:italic;}
  .btn-small{
    background:#1c1a17; color:#f4ebe3; border:none; padding:9px 18px; font-size:13px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; font-family:inherit;
  }
  .btn-small:disabled{opacity:0.5; cursor:default;}
  .verify-error{font-size:13.5px; color:#a3402f; margin-top:6px; display:none;}
  .deposit-row{margin-top:12px; padding-top:12px; border-top:1px solid #f0e6d6;}
  /* Still used by the deposit block inside a details row. */
  .figure-label{opacity:0.55; text-transform:uppercase; letter-spacing:0.05em; font-size:10px; display:block; margin-bottom:2px;}
  .figure-value{font-size:14px;}
  .deposit-status-badge{font-size:10.5px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em; margin-left:8px;}
  .deposit-status-held{background:#f5ecd7; color:#8a6c39;}
  .deposit-status-disputed{background:#f5e0da; color:#a3402f;}
  .deposit-status-refunded{background:#e3f0e5; color:#3a7d44;}
  .deposit-status-resolved{background:#e3f0e5; color:#3a7d44;}
  .sidebar-add-btn{
    background:white; border:1px dashed #ddd0bc; padding:9px; font-size:11px; letter-spacing:0.05em;
    text-transform:uppercase; cursor:pointer; width:100%; color:#8a6c39; margin-bottom:6px;
  }
  .profile-modal-body{padding:24px;}
  .profile-modal-body .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .profile-modal-body .field label{font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; opacity:0.6;}
  .profile-modal-body .field input{
    padding:11px; font-size:14px; border:1px solid #ccc; background:white; color:#1c1a17;
    font-family:'Jost', sans-serif;
  }
  .profile-modal-body .field input:disabled{background:#ebe2d4; opacity:0.7; cursor:not-allowed;}
</style>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<body>

<div class="wrap">
  <a href="host-dashboard.html" class="back-home">&larr; Back to My Collection</a>
  <div class="top-row">
    <div><h1>My Earnings</h1></div>
  </div>

  <!-- The same action-needed warning as the dashboard. Earnings is the
       page hosts open most, so a requirement that will take a listing
       down should not be visible only somewhere else. -->
  <div id="complianceNotice" style="display:none;"></div>

  <h2 class="section-heading">Your Performance</h2>
  <div id="analyticsContainer">
    <p class="loading">Loading your analytics…</p>
  </div>

  <h2 class="section-heading">Your Earnings</h2>
  <div id="bookingsContainer">
    <p class="loading">Loading your bookings…</p>
  </div>
</div>

<script>
  const API_BASE = 'https://aerva-in.vercel.app';
  // localStorage can throw (Safari private mode, blocked storage).
  const safeStorage = {
    get(key){ try { return localStorage.getItem(key); } catch(e){ return null; } },
    remove(key){ try { localStorage.removeItem(key); } catch(e){ /* no-op */ } }
  };
  const sessionToken = safeStorage.get('aerva_guest_session');
  if(!sessionToken) window.location.replace('guest-login.html');

  function statusBadgeHtml(status){
    return `<span class="status-badge status-${status}">${status}</span>`;
  }

  // The earnings block below calls loadListings() after a dispute,
  // cancellation or coupon purchase to pull fresh figures. On the
  // dashboard that reloaded the listing grid too; here there is no grid,
  // so it maps onto the bookings refresh alone. Kept under the original
  // name so the moved code is byte-identical to what it was and can be
  // diffed against the dashboard if anything ever looks wrong.
  function loadListings(){ return loadEarnings(); }

  // Same notice as host-dashboard.html, kept deliberately short here:
  // what is wrong, on which listing, by when, and where to fix it.
  // The signed manage link, or the dashboard if one could not be built —
  // never a link that opens a page unable to do anything.
  function escapeNoticeUrl(url){
    return (typeof url === 'string' && url.startsWith('https://') && url.includes('manage-listing.html'))
      ? url.replace(/"/g, '&quot;')
      : 'host-dashboard.html';
  }

  function renderComplianceNotices(notices){
    const box = document.getElementById('complianceNotice');
    if(!box) return;
    if(!Array.isArray(notices) || !notices.length){ box.style.display = 'none'; box.innerHTML = ''; return; }
    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const dueText = (n) => (n.autoBlocked || n.listingStatus === 'blocked')
      ? 'Taken down — fix to restore'
      : (n.daysLeft <= 0 ? 'Due today' : n.daysLeft + ' day' + (n.daysLeft === 1 ? '' : 's') + ' left');
    box.style.display = 'block';
    box.innerHTML = notices.map(n => {
      const urgent = n.autoBlocked || n.listingStatus === 'blocked' || n.daysLeft <= 3;
      return '<div class="notice-card' + (urgent ? ' notice-urgent' : '') + '">'
        + '<div class="notice-head"><h3 class="notice-title">' + esc(n.propertyName) + '</h3>'
        + '<span class="notice-due">' + esc(dueText(n)) + '</span></div>'
        + '<p class="notice-body">' + esc(n.message) + '</p>'
        + '<a class="notice-action" href="' + escapeNoticeUrl(n.manageLink) + '">Fix this now</a></div>';
    }).join('');
  }

  // `period` is 'YYYY-MM', 'YYYY', or null for the most recent bookings.
  // The server sends exactly that period when asked, which is what stops
  // this table disagreeing with the charts above it.
  async function loadEarnings(period){
    const container = document.getElementById('bookingsContainer');
    try{
      const res = await fetch(API_BASE + '/api/host-listings'
          + (period ? '?bookingsPeriod=' + encodeURIComponent(period) : ''), {
        headers: { 'Authorization': 'Bearer ' + sessionToken }
      });
      if(res.status === 401){
        safeStorage.remove('aerva_guest_session');
        window.location.replace('guest-login.html');
        return;
      }
      if(!res.ok) throw new Error('failed');
      const data = await res.json();
      renderComplianceNotices(data.complianceNotices || []);
      allBookings = Array.isArray(data.bookings) ? data.bookings : [];
      bookingsMeta = data.bookingsMeta || { period: period || null, truncated: false };
      loadedPeriod = bookingsMeta.period || null;
      renderBookings();
    }catch(err){
      console.error('earnings load failed:', err);
      container.innerHTML = '<p class="empty">Could not load your bookings. Please refresh.</p>';
    }
  }

  // ---- What the earnings table is showing ----
  //
  // Every booking the server sent, kept here so changing the period or
  // clicking a month on a chart re-renders instantly and never refetches.
  let allBookings = [];
  // Which slice of history `allBookings` actually holds: null means "the
  // most recent ones", otherwise the 'YYYY-MM' or 'YYYY' the server was
  // asked for. Without this the page cannot tell an empty month from a
  // month it simply has not fetched, and it used to report the second as
  // the first — "Nothing booked in MAY 2026" under a chart showing
  // thirteen bookings in May.
  let loadedPeriod = null;
  let bookingsMeta = { period: null, truncated: false };
  // A fetch in flight, so the same one is not sent twice. These are two
  // separate variables on purpose: `null` is a legitimate period ("the
  // recent ones"), so it cannot also stand for "nothing in flight" —
  // conflating them left the page stuck on "Loading…" when going back to
  // a rolling period, because idle and wanted looked equal.
  let fetchInFlight = false;
  let fetchingPeriod = null;
  // The default is ONE MONTH. A host opening this page wants to know what
  // came in recently, not to scroll two years of history — and the money
  // that matters is the money that just landed.
  let earnScope = { kind:'period', months:1 };
  const EARN_PERIODS = [[1,'1 month'],[3,'3 months'],[6,'6 months'],[12,'1 year'],[0,'All time']];
  const openDetails = new Set();       // which bookings are expanded

  // Money coming in and money that fell through are two different
  // questions, and mixing them makes both harder to read: a cancelled
  // booking has no payout to total up, and an earnings total that
  // quietly included one would be wrong. So they are separate views
  // with their own columns, rather than one table with a filter.
  //
  //   'earned'    — confirmed bookings. What you were paid.
  //   'cancelled' — cancellations and refunds. What fell through, what
  //                 it cost you, and whether the guest's money is
  //                 actually back.
  let earnView = 'earned';
  const CANCELLED_STATUSES = ['cancelled', 'refunded'];

  // Bucketed by when the booking was PAID (created_at), which is the same
  // clock the charts above use — so a month on a chart and a month in
  // this table always mean the same thing. Bucketing by arrival here
  // would put a row in a month its money never arrived in.
  // In the cancelled view the question changes from "what did I earn in
  // this period" to "what fell through in this period", so a cancellation
  // is placed by the day it was cancelled, not the day it was booked.
  // The view is passed in rather than read from earnView, so the count on
  // the "Cancelled & refunded" tab is worked out exactly the way that tab
  // will work it out — a tab reading (2) that opens onto 3 rows is worse
  // than no count at all.
  const earnDateOf = (b, view) => (view === 'cancelled' && b.cancelled_at) ? b.cancelled_at : b.created_at;
  const earnMonthKey = (b, view) => String(earnDateOf(b, view) || '').slice(0, 7);

  // The analytics filters sit above this table and describe the same
  // bookings, so they apply here too: filter the chart to one listing and
  // the earnings below follow. Listing type isn't on a booking row, so it
  // comes from the listing list the analytics fetch already returned.
  function earnListingType(listingId){
    const l = (anData && anData.listings || []).find(x => String(x.id) === String(listingId));
    return l ? l.type : 'stay';
  }

  function earnScopeLabel(){
    if(earnScope.kind === 'month'){
      return anMonthLabel(earnScope.month) + ' ' + earnScope.month.slice(0, 4);
    }
    if(earnScope.kind === 'year') return String(earnScope.year);
    if(!earnScope.months) return 'all time';
    return 'the last ' + (earnScope.months === 1 ? 'month' : earnScope.months + ' months');
  }

  // The period this scope needs from the server, or null for "the recent
  // ones", which is what every rolling period view uses.
  function scopeNeedsPeriod(){
    if(earnScope.kind === 'month') return earnScope.month;
    if(earnScope.kind === 'year')  return String(earnScope.year);
    return null;
  }

  // Fetches the scope's period if it is not already loaded. Returns true
  // when a fetch was started, so the caller can show that it is working
  // rather than briefly claiming there is nothing there.
  function ensureScopeLoaded(){
    const want = scopeNeedsPeriod();
    if(want === loadedPeriod) return false;
    if(fetchInFlight && fetchingPeriod === want) return true;   // already on its way
    fetchInFlight = true;
    fetchingPeriod = want;
    loadEarnings(want).finally(() => { fetchInFlight = false; });
    return true;
  }

  function earnInScope(b, view){
    // When the server was asked for exactly this period, it has already
    // done the filtering — and with the same month boundaries the charts
    // use. Re-deciding it here from an ISO string would disagree with the
    // server either side of midnight at the turn of a month.
    if(loadedPeriod && loadedPeriod === scopeNeedsPeriod()) return true;
    const key = earnMonthKey(b, view);
    if(earnScope.kind === 'month') return key === earnScope.month;
    if(earnScope.kind === 'year')  return key.slice(0, 4) === String(earnScope.year);
    if(!earnScope.months) return true;
    // Rolling from today, not from the 1st — "1 month" on the 3rd of the
    // month should not mean three days.
    const from = new Date();
    from.setMonth(from.getMonth() - earnScope.months);
    return new Date(earnDateOf(b, view)) >= from;
  }

  // The listing and type filters on the chart still apply to both views.
  // The chart's STATUS filter does not: which view you are looking at
  // decides that, and having two controls disagree about it would be
  // worse than having one.
  function earnFiltered(view){
    const want = view || earnView;
    return allBookings.filter(b => {
      if(!earnInScope(b, want)) return false;
      if(anType !== 'all' && earnListingType(b.listing_id) !== anType) return false;
      if(anListingId !== 'all' && String(b.listing_id) !== String(anListingId)) return false;
      return want === 'cancelled'
        ? CANCELLED_STATUSES.includes(b.status)
        : b.status === 'paid';
    });
  }

  // Refund amounts are stored in the charge currency's subunit, so a
  // foreign booking's refund is not paise and must not get a ₹.
  function earnRefundText(b){
    const status = b.refund_status;
    if(!status) return '—';
    const word = { processed:'Refunded', pending:'Refund pending', creating:'Refund pending',
                   new:'Refund pending', failed:'Refund failed' }[status] || status;
    const cur = String(b.charge_currency || 'INR').toUpperCase();
    const amt = Number(b.refund_amount_subunit) || 0;
    if(!amt) return word;
    const money = cur === 'INR'
      ? '₹' + Math.round(amt / 100).toLocaleString('en-IN')
      : (amt / 100).toFixed(2) + ' ' + cur;
    return money + '<small style="display:block; opacity:0.6;">' + word + '</small>';
  }

  function renderBookings(){
    const container = document.getElementById('bookingsContainer');
    const fmt = (n) => '₹' + Number(n).toLocaleString('en-IN');

    const cancelled = earnView === 'cancelled';
    // The count sits on the tab so a host can see there is something
    // worth looking at without switching to it first.
    const cancelledCount = earnFiltered('cancelled').length;

    const periodBar = `<div class="earn-scope">
      <div class="an-toggle">
        <button type="button" data-earn-view="earned" class="${cancelled ? '' : 'on'}">Earned</button>
        <button type="button" data-earn-view="cancelled" class="${cancelled ? 'on' : ''}">Cancelled &amp; refunded${cancelledCount ? ` (${cancelledCount})` : ''}</button>
      </div>
      <div class="an-toggle">
        ${EARN_PERIODS.map(([m, l]) =>
          `<button type="button" data-earn-months="${m}" class="${earnScope.kind==='period' && earnScope.months===m ? 'on' : ''}">${l}</button>`).join('')}
      </div>
      ${earnScope.kind !== 'period'
        ? `<span class="earn-from-chart">From the chart · ${anEsc(earnScopeLabel())}</span>`
        : ''}
    </div>`;

    // If this scope's bookings have not been fetched yet, say so and let
    // the fetch come back — never report an unfetched month as an empty
    // one, which is exactly how this table came to contradict the chart
    // above it.
    if(ensureScopeLoaded()){
      container.innerHTML = periodBar + '<p class="loading">Loading those bookings…</p>';
      bindEarnControls(container);
      return;
    }
    if(!allBookings.length && !loadedPeriod){
      container.innerHTML = '<p class="empty">No bookings yet.</p>';
      return;
    }
    const bookings = earnFiltered();
    if(!bookings.length){
      const wider = earnScope.kind === 'period' && earnScope.months
        ? ' Try a longer period above.' : '';
      container.innerHTML = periodBar
        + (cancelled
          ? `<p class="empty">Nothing was cancelled or refunded in ${anEsc(earnScopeLabel())}.${wider}</p>`
          : `<p class="empty">Nothing booked in ${anEsc(earnScopeLabel())}.${wider}</p>`);
      bindEarnControls(container);
      return;
    }

    const escA = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const rows = bookings.map(b => {
      const guestPaidForStay = (Number(b.subtotal) || 0) + (Number(b.gst) || 0);
      // Dates arrive as ISO strings; only the YYYY-MM-DD part is the stay
      // date. Read as a local date so no timezone can shift it a day.
      const ymdLocal = (v) => new Date(String(v || '').slice(0, 10) + 'T00:00:00');
      const dateRange = ymdLocal(b.arrival).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) +
        ' – ' + ymdLocal(b.departure).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

      // Deposit section — only shown at all if this booking actually had
      // one (deposit_status defaults to 'none' for bookings on listings
      // with no security deposit set). "Raise a Concern" only appears
      // while it's still 'held' and the 7-day window hasn't closed yet —
      // the same two checks the backend enforces, so a host never sees a
      // button that would just fail when clicked.
      let depositHtml = '';
      if(b.deposit_status && b.deposit_status !== 'none'){
        const releaseDate = b.deposit_release_at ? new Date(b.deposit_release_at) : null;
        // The server says whether the window is open (the listing's own
        // calendar, release day included); the date check is a fallback.
        const canDispute = b.deposit_status === 'held' && releaseDate
          && (typeof b.deposit_window_open === 'boolean' ? b.deposit_window_open : new Date() < new Date(releaseDate.getTime() + 86400000));
        const releaseLabel = releaseDate
          ? releaseDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' })
          : '';

        let statusNote = '';
        if(b.deposit_status === 'held') statusNote = `Held until ${releaseLabel} unless you raise a concern.`;
        else if(b.deposit_status === 'disputed') statusNote = 'Under review by Aerva — you\'ll hear back once it\'s resolved.';
        else if(b.deposit_status === 'refunded') statusNote = 'The 7-day window passed with no concern raised — refunded to the guest in full.';
        else if(b.deposit_status === 'resolved') statusNote = `Resolved — ${fmt(b.deposit_resolution_amount || 0)} credited toward your payout, remainder refunded to the guest.`;

        depositHtml = `
          <div class="deposit-row">
            <span class="figure-label">Security Deposit</span>
            <span class="figure-value">${fmt(b.deposit_amount)}<span class="deposit-status-badge deposit-status-${escA(b.deposit_status)}">${escA(b.deposit_status)}</span></span>
            <div class="dispute-note">${statusNote}</div>
            ${b.dispute_reason ? `<div class="dispute-reason-shown">Your note: "${escA(b.dispute_reason)}"</div>` : ''}
            ${canDispute ? `
              <button type="button" class="dispute-btn" data-order-id="${b.id}" onclick="toggleDisputeForm(${b.id})">Raise a Concern</button>
              <div class="dispute-form" id="disputeForm-${b.id}">
                <textarea id="disputeReason-${b.id}" rows="3" placeholder="What happened? (damage, missing items, extra cleaning needed, etc.)"></textarea>
                <button type="button" class="btn-small" onclick="submitDispute(${b.id})">Submit</button>
                <p class="verify-error" id="disputeError-${b.id}"></p>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Cancellation — only offered while the booking is still 'paid' and
      // check-in is more than 48 hours away. The server works this out
      // (can_cancel) with the exact rule the cancel action enforces: the
      // listing's check-in time, on the property's own clock.
      const canCancel = b.status === 'paid' && b.can_cancel === true;
      let cancellationHtml = '';
      if(b.status === 'cancelled'){
        cancellationHtml = `
          <div class="deposit-row">
            <span class="deposit-status-badge deposit-status-rejected">Cancelled</span>
            ${b.cancellation_reason ? `<div class="dispute-reason-shown">Reason: "${escA(b.cancellation_reason)}"</div>` : ''}
          </div>
        `;
      } else if(canCancel){
        cancellationHtml = `
          <div class="deposit-row">
            <button type="button" class="dispute-btn" onclick="toggleCancelForm(${b.id})">Cancel This Booking</button>
            <div class="dispute-form" id="cancelForm-${b.id}">
              <p style="font-size:12.5px; opacity:0.7; margin-bottom:8px;">This refunds the guest in full and cannot be undone. Only available more than 48 hours before check-in.</p>
              <select id="cancelReasonCode-${b.id}" style="width:100%; padding:9px; margin-bottom:8px; border:1px solid #d9cfc2; border-radius:6px; font-size:14px;">
                <option value="">Choose a reason (the guest is told)</option>
                <option value="property_unavailable">Property unavailable (repairs or damage)</option>
                <option value="double_booking">Double booking</option>
                <option value="safety">Safety concern at the property</option>
                <option value="environmental">Environmental hazard (flood, fire, landslide or similar)</option>
                <option value="emergency">Personal or family emergency</option>
                <option value="government">Government order or travel restriction</option>
                <option value="other">Other</option>
              </select>
              <textarea id="cancelReason-${b.id}" rows="3" placeholder="Details (required for Other)"></textarea>
              <button type="button" class="btn-small" onclick="submitCancellation(${b.id})">Confirm Cancellation</button>
              <p class="verify-error" id="cancelError-${b.id}"></p>
            </div>
          </div>
        `;
      } else if(b.status === 'paid'){
        cancellationHtml = `<div class="deposit-row"><p style="font-size:12px; opacity:0.55;">This stay checks in within 48 hours — no longer cancellable from here. Contact hello@aerva.in if urgent.</p></div>`;
      }

      const swapHtml = ''; // replaced: every host cancellation now gives the guest a refund plus a 10% coupon

      // Real pet species, not just a headcount — see create-order.js's
      // validation and the guest-facing picker in index.html that
      // collects this. Only shown when the guest actually declared any.
      // Also service / support animals and young litter — never charged,
      // but the host needs to know they are coming.
      const animalBits = [];
      if(Array.isArray(b.pet_types) && b.pet_types.length) animalBits.push('Pets: ' + b.pet_types.map(escA).join(', '));
      if(Number(b.young_litter_count) > 0) animalBits.push('Young litter: ' + Number(b.young_litter_count));
      const serviceAnimals = (Array.isArray(b.service_animal_types) ? b.service_animal_types : [])
        .map(a => (a && typeof a === 'object') ? a.type : a).filter(Boolean);
      if(serviceAnimals.length) animalBits.push('Service/support animal' + (serviceAnimals.length === 1 ? '' : 's') + ': ' + serviceAnimals.map(escA).join(', '));
      const petTypesHtml = animalBits.length
        ? `<div class="booking-dates" style="opacity:0.75;">🐾 ${animalBits.join(' · ')}</div>`
        : '';

      // Everything that needs room — the deposit, the cancellation form,
      // the animals coming — lives in a row that opens underneath. The
      // markup is exactly what the cards used, so every button and form
      // on it still works the way it always did.
      const detailHtml = depositHtml + cancellationHtml + swapHtml + petTypesHtml;
      const isOpen = openDetails.has(b.id);
      // One quiet line so a host does not have to open every row to find
      // the one that needs them.
      const flag = cancelled
        ? (b.refund_status === 'failed' ? '<span class="earn-cost">Refund failed</span>'
          : b.cancellation_reason ? escA(String(b.cancellation_reason).slice(0, 60)) : '')
        : b.deposit_status === 'disputed' ? 'Deposit under review'
        : b.deposit_status === 'held' ? 'Deposit held'
        : (Array.isArray(b.pet_types) && b.pet_types.length) ? '🐾 Bringing pets'
        : '';
      const myPayout = (Number(b.payout_amount) || 0) - (Number(b.cohost_share) || 0);
      // What the host truly won't get (server: not_earned). A guest who
      // cancelled under the policy may still leave the host a payout.
      const notEarned = b.not_earned != null ? Number(b.not_earned) || 0 : myPayout;
      const commissionRate = Number(b.commission_rate);

      return `
        <tr>
          <td data-label="">
            <span class="earn-prop">${escA(b.suite_name)}</span>
            ${b.guest_name ? `<span class="earn-guest">${escA(b.guest_name)}</span>` : ''}
            ${flag ? `<span class="earn-flag">${flag}</span>` : ''}
          </td>
          <td data-label="Stay" class="earn-when">${dateRange}
            <small>${b.nights} night${b.nights === 1 ? '' : 's'}${b.guests ? ' · ' + b.guests + ' guest' + (b.guests === 1 ? '' : 's') : ''}</small></td>
          ${cancelled ? `
          <td data-label="Cancelled" class="earn-when">${b.cancelled_at ? new Date(b.cancelled_at).toLocaleDateString('en-IN', { month:'short', day:'numeric', year:'numeric' }) : '—'}
            <small>${b.cancelled_by === 'guest' ? 'by the guest' : b.cancelled_by === 'host' ? 'by you' : ''}</small>
            ${b.cancelled_by === 'guest' && myPayout > 0 ? `<small>you still get ${fmt(myPayout)}</small>` : ''}</td>
          <td data-label="Refund to guest" class="num">${earnRefundText(b)}</td>
          <td data-label="Cost to you" class="num">${Number(b.coupon_cost) > 0
            ? `<span class="earn-cost">− ${fmt(b.coupon_cost)}</span><small style="display:block; opacity:0.6;">guest coupon</small>`
            : '—'}</td>
          <td data-label="Not earned" class="num earn-lost">${fmt(notEarned)}</td>
          ` : `
          <td data-label="Guest paid" class="num">${fmt(guestPaidForStay)}</td>
          <td data-label="Commission" class="num">− ${fmt(Number(b.commission_amount) || 0)}${Number.isFinite(commissionRate) && b.commission_rate !== null && b.commission_rate !== '' ? `<small style="display:block; opacity:0.5;">${commissionRate}%</small>` : ''}</td>
          <td data-label="Co-host" class="num">${Number(b.cohost_share) > 0 ? '− ' + fmt(b.cohost_share) : '—'}</td>
          <td data-label="Your payout" class="num payout-value">${fmt(myPayout)}</td>
          `}
          <td data-label="Status">${statusBadgeHtml(b.status)}</td>
          <td data-label="" class="${detailHtml.trim() ? '' : 'is-blank'}">${detailHtml.trim()
            ? `<button type="button" class="earn-more" data-earn-toggle="${b.id}" aria-expanded="${isOpen}">${isOpen ? 'Hide' : 'Details'}</button>`
            : ''}</td>
        </tr>
        ${detailHtml.trim() && isOpen
          ? `<tr class="earn-detail"><td colspan="8">${detailHtml}</td></tr>`
          : ''}
      `;
    }).join('');

    // The point of a table: the bottom line, without a calculator.
    const t = bookings.reduce((a, b) => ({
      paid:   a.paid   + (Number(b.subtotal) || 0) + (Number(b.gst) || 0),
      comm:   a.comm   + (Number(b.commission_amount) || 0),
      cohost: a.cohost + (Number(b.cohost_share) || 0),
      payout: a.payout + (Number(b.payout_amount) || 0) - (Number(b.cohost_share) || 0),
      lost:   a.lost   + (b.not_earned != null ? (Number(b.not_earned) || 0) : (Number(b.payout_amount) || 0) - (Number(b.cohost_share) || 0)),
      nights: a.nights + Number(b.nights || 0),
      coupon: a.coupon + Number(b.coupon_cost || 0)
    }), { paid:0, comm:0, cohost:0, payout:0, lost:0, nights:0, coupon:0 });
    // Refunds are only totalled when every one of them is in rupees —
    // adding a paise figure to a foreign subunit would produce a number
    // that means nothing.
    const allInr = bookings.every(b => String(b.charge_currency || 'INR').toUpperCase() === 'INR');
    const refundTotal = allInr
      ? bookings.reduce((a, b) => a + (Number(b.refund_amount_subunit) || 0), 0) / 100
      : null;
    const anyRefundProblem = bookings.some(b => b.refund_status === 'failed');

    const filterNote = (anListingId !== 'all' || anType !== 'all')
      ? ' · matching the filters on the chart above' : '';
    const note = cancelled
      ? `Showing <b>${bookings.length} cancelled or refunded booking${bookings.length===1?'':'s'}</b> from <b>${anEsc(earnScopeLabel())}</b>${filterNote}.`
        + (anyRefundProblem ? ' <b class="earn-cost">A refund failed — please write to hello@aerva.in.</b>' : '')
      : `Showing <b>${bookings.length} booking${bookings.length===1?'':'s'}</b> paid for in <b>${anEsc(earnScopeLabel())}</b>${filterNote}.`
        + (cancelledCount ? ` ${cancelledCount} cancelled or refunded booking${cancelledCount===1?' is':'s are'} under “Cancelled &amp; refunded”.` : '');

    // The rolling views ("All time" above all) still work from the most
    // recent bookings the server sends. Say when that is not everything,
    // rather than letting a total quietly understate itself.
    const truncNote = (!loadedPeriod && bookingsMeta.truncated && bookingsMeta.oldest)
      ? `<p class="earn-scope-note">These are your most recent ${bookingsMeta.returned} bookings, back to ${new Date(bookingsMeta.oldest).toLocaleDateString('en-IN', { month:'short', day:'numeric', year:'numeric' })}. For anything older, click its month on the chart above.</p>`
      : '';

    const head = cancelled
      ? `<th>Booking</th><th>Stay</th><th>Cancelled</th>
         <th class="num">Refund to guest</th><th class="num">Cost to you</th>
         <th class="num">Not earned</th><th>Status</th><th></th>`
      : `<th>Booking</th><th>Stay</th><th class="num">Guest paid</th>
         <th class="num">Commission</th><th class="num">Co-host</th>
         <th class="num">Your payout</th><th>Status</th><th></th>`;

    const foot = cancelled
      ? `<td class="foot-label" data-label="">${bookings.length} booking${bookings.length===1?'':'s'}</td>
         <td class="foot-label" data-label="">${t.nights} night${t.nights===1?'':'s'}</td>
         <td class="is-blank"></td>
         <td class="num" data-label="Refunded to guests">${refundTotal === null ? '—' : fmt(Math.round(refundTotal))}</td>
         <td class="num earn-cost" data-label="Cost to you">${t.coupon > 0 ? '− ' + fmt(t.coupon) : '—'}</td>
         <td class="num earn-lost" data-label="Total not earned">${fmt(t.lost)}</td>
         <td class="is-blank"></td><td class="is-blank"></td>`
      : `<td class="foot-label" data-label="">${bookings.length} booking${bookings.length===1?'':'s'}</td>
         <td class="foot-label" data-label="">${t.nights} night${t.nights===1?'':'s'}</td>
         <td class="num" data-label="Guest paid">${fmt(t.paid)}</td>
         <td class="num" data-label="Commission">− ${fmt(t.comm)}</td>
         <td class="num" data-label="Co-host">${t.cohost > 0 ? '− ' + fmt(t.cohost) : '—'}</td>
         <td class="num payout-value" data-label="Total payout">${fmt(t.payout)}</td>
         <td class="is-blank"></td><td class="is-blank"></td>`;

    container.innerHTML = periodBar
      + `<p class="earn-scope-note">${note}</p>`
      + truncNote
      + `<div class="earn-scroll"><table class="earn-table">
        <thead><tr>${head}</tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>${foot}</tr></tfoot>
      </table></div>`;

    bindEarnControls(container);
  }

  // Bound on EVERY path out of renderBookings, including the empty and
  // loading ones. They used to be attached only after a table had been
  // drawn, so an empty view killed its own controls: land on a month
  // with no bookings and the period buttons and the Earned / Cancelled
  // tabs all stopped responding, with no way back out of it.
  function bindEarnControls(container){
    container.querySelectorAll('[data-earn-view]').forEach(el => el.addEventListener('click', () => {
      earnView = el.dataset.earnView;
      openDetails.clear();   // the rows are different rows now
      renderBookings();
    }));
    container.querySelectorAll('[data-earn-months]').forEach(el => el.addEventListener('click', () => {
      earnScope = { kind:'period', months: Number(el.dataset.earnMonths) };
      // The table is no longer following the chart, so the chart should
      // not still be showing one month highlighted as if it were.
      if(anSelectedMonth){ anSelectedMonth = null; anRender(); }
      renderBookings();
    }));
    container.querySelectorAll('[data-earn-toggle]').forEach(el => el.addEventListener('click', () => {
      const id = Number(el.dataset.earnToggle);
      if(openDetails.has(id)) openDetails.delete(id); else openDetails.add(id);
      renderBookings();
    }));
  }

  function toggleDisputeForm(orderId){
    const form = document.getElementById('disputeForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function submitDispute(orderId){
    const reasonEl = document.getElementById('disputeReason-' + orderId);
    const errorEl = document.getElementById('disputeError-' + orderId);
    errorEl.style.display = 'none';
    const reason = reasonEl.value.trim();
    if(!reason){
      errorEl.textContent = 'Please describe the concern first.';
      errorEl.style.display = 'block';
      return;
    }
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ raiseDispute: { orderId, reason } })
      });
      const data = await res.json();
      if(res.ok){
        loadListings();
      } else {
        errorEl.textContent = data.error || 'Could not submit your concern. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch(err){
      errorEl.textContent = 'Could not submit your concern. Please try again.';
      errorEl.style.display = 'block';
    }
  }

  function toggleCancelForm(orderId){
    const form = document.getElementById('cancelForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  // Host cancellation. The guest is refunded in full (booking and deposit)
  // and gets an Aerva coupon worth 10% of the booking, which the host pays
  // for: now (Razorpay), or by deduction from their next payout. The amount
  // comes from the server. The host never sees the coupon code.
  async function submitCancellation(orderId){
    const reasonEl = document.getElementById('cancelReason-' + orderId);
    const errorEl = document.getElementById('cancelError-' + orderId);
    const show = (msg) => { errorEl.textContent = msg; errorEl.style.display = 'block'; };
    errorEl.style.display = 'none';
    const reason = reasonEl.value.trim();
    const codeEl = document.getElementById('cancelReasonCode-' + orderId);
    const reasonCode = codeEl ? codeEl.value : '';
    if(!reasonCode){ show('Choose a reason for cancelling.'); return; }
    if(reasonCode === 'other' && !reason){ show('Add details for “Other”.'); return; }
    const inr = (n) => '₹' + Number(n).toLocaleString('en-IN');
    const post = (body) => fetch(API_BASE + '/api/host-listings', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken }, body: JSON.stringify(body)
    }).then(async r => ({ ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) }));
    const cancelNow = async (extra) => {
      const r = await post({ cancelBooking: Object.assign({ orderId, reasonCode, details: reason }, extra || {}) });
      if(r.ok){ loadListings(); if(typeof loadPayoutDeductions === 'function') loadPayoutDeductions(); return true; }
      show(r.data.error || 'Could not cancel this booking. Please try again.');
      return false;
    };
    try{
      // Already paid for the coupon (e.g. a retry)? Then this cancels straight away.
      const first = await post({ cancelBooking: { orderId, reasonCode, details: reason } });
      if(first.ok){ loadListings(); return; }
      if(!(first.status === 402 && first.data.needsCoupon)){ show(first.data.error || 'Could not cancel this booking. Please try again.'); return; }
      const amount = Number(first.data.amount) || 0;
      // Co-hosts pay the coupon up front: their share is paid in full, without deductions.
      const isCohostMode = !!(window.AervaCohost && typeof window.AervaCohost.get === 'function' && window.AervaCohost.get());
      let box = document.getElementById('cancelChoice-' + orderId);
      if(!box){
        box = document.createElement('div');
        box.id = 'cancelChoice-' + orderId;
        box.className = 'cancel-choice';
        box.style.cssText = 'margin-top:12px; padding:14px; border:1px solid #ece4d8; border-radius:10px; background:#fff;';
        errorEl.parentNode.insertBefore(box, errorEl);
      }
      box.innerHTML = '<p style="font-size:14.5px; margin:0 0 6px;"><strong>Guest’s cancellation coupon: ' + inr(amount) + ' (10% of the booking).</strong></p>'
        + '<p style="font-size:13.5px; margin:0 0 12px; opacity:0.8;">The guest is refunded in full (booking and deposit) straight away, and gets this coupon by email 15 minutes later. This cannot be undone.</p>'
        + '<div style="display:flex; gap:8px; flex-wrap:wrap;">'
        + '<button type="button" class="btn-small" data-choice="now">Pay ' + inr(amount) + ' now and cancel</button>'
        + (isCohostMode ? '' : '<button type="button" class="dispute-btn" data-choice="later">Cancel, deduct ' + inr(amount) + ' from my next payout</button>')
        + '</div>';
      if(box.querySelector('[data-choice="later"]')) box.querySelector('[data-choice="later"]').addEventListener('click', async () => {
        box.querySelectorAll('button').forEach(b => { b.disabled = true; });
        if(await cancelNow({ payLater: true })) box.remove(); else box.querySelectorAll('button').forEach(b => { b.disabled = false; });
      });
      box.querySelector('[data-choice="now"]').addEventListener('click', async () => {
        const buy = await post({ buyCouponOrder: { bookingId: orderId } });
        if(!buy.ok){ show(buy.data.error || 'Could not start the coupon payment.'); return; }
        if(buy.data.alreadyPaid){ if(await cancelNow()) box.remove(); return; }
        if(!window.Razorpay){ show('Payment is not available right now. Try again, or choose to deduct it from your next payout.'); return; }
        new window.Razorpay({
          key: buy.data.keyId, amount: buy.data.amount * 100, currency: 'INR', order_id: buy.data.razorpayOrderId,
          name: 'Aerva', description: 'Guest cancellation coupon',
          handler: async (resp) => {
            const v = await post({ verifyCouponPayment: { couponId: buy.data.couponId, ...resp } });
            if(!v.ok){ show(v.data.error || 'Could not confirm the coupon payment. Please contact hello@aerva.in.'); return; }
            if(await cancelNow()) box.remove();
          }
        }).open();
      });
    } catch(err){
      show('Could not cancel this booking. Please try again.');
    }
  }



  // ================= ANALYTICS =================
  // One fetch (?analytics=1) returns the raw grain — one row per
  // month × listing × timing bucket. Every control below is a different
  // grouping of those same rows, done in memory, so switching a filter
  // or clicking a month bar is instant and never re-queries.
  //
  // Bars are hand-built inline SVG rather than a charting library:
  // nothing else on this page loads a third-party script, and an SVG
  // with a viewBox and no fixed width scales itself on a phone.

  // Two buckets, not three. The host is paid in full at booking time, so
  // every rupee here has already landed — what differs is whether the
  // STAY has been delivered yet. 'Upcoming' is therefore revenue already
  // banked against nights still owed, which is the forecast a host cares
  // about, not money still to arrive.
  const AN_BUCKETS = [
    { key:'current',  label:'Stays delivered', color:'#3a7d44' },
    { key:'upcoming', label:'Still to deliver', color:'#c2b49a' }
  ];
  const AN_MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  let anData = null;                 // whole payload from the server
  let anYear = null;                 // a year number, or 'compare'
  let anType = 'all';                // all | stay | experience
  let anListingId = 'all';           // 'all' or a listing id
  let anSelectedMonth = null;        // 'YYYY-MM' when a bar is clicked
  let anStatus = 'paid';             // paid | all | cancelled | refunded
  let anMetric = 'payout';           // payout | bookings

  // Axis maximum, rounded UP to a clean number with headroom above the
  // tallest bar. Scaling exactly to the data made the biggest bar touch
  // the top of the plot with its value label clipped against the frame,
  // and produced gridline labels like ₹137.4k.
  function anNiceMax(raw){
    const data = Math.max(raw, 1);
    // Booking counts are whole things — a gridline reading "1.2 bookings"
    // is nonsense — so round up to a multiple of 4, which is how many
    // gridline intervals the charts draw.
    if(anMetric === 'bookings'){
      return Math.max(4, Math.ceil((data * 1.12) / 4) * 4);
    }
    const v = data * 1.10;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    // A fine ladder on purpose. A coarse one (1, 2, 5, 10) turned 90,000
    // into an axis topping out at 200,000, leaving every bar under half
    // height and the chart looking empty. Each of these divides into four
    // readable gridline steps.
    const ladder = [1, 1.2, 1.4, 1.6, 1.8, 2, 2.4, 3, 4, 5, 6, 8, 10];
    const step = ladder.find(x => n <= x) || 10;
    return step * mag;
  }
  function anFmt(v){ return anMetric === 'bookings' ? String(Math.round(v)) : anMoney(v); }
  function anFmtFull(v){ return anMetric === 'bookings' ? Math.round(v) + (Math.round(v)===1?' booking':' bookings') : anMoneyFull(v); }

  // Listing names are host-supplied text going into markup. Same rule as
  // the message renderers in index.html — escape before it reaches
  // innerHTML, or a property named with an <img onerror=...> runs script.
  function anEsc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function anMoney(n){
    const v = Number(n) || 0;
    if(v >= 10000000) return '₹' + (v/10000000).toFixed(2).replace(/\.00$/,'') + 'Cr';
    if(v >= 100000)   return '₹' + (v/100000).toFixed(2).replace(/\.00$/,'') + 'L';
    if(v >= 1000)     return '₹' + (v/1000).toFixed(1).replace(/\.0$/,'') + 'k';
    return '₹' + v.toLocaleString('en-IN');
  }
  function anMoneyFull(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN'); }
  // Built from the string, never through new Date(), so a month label
  // can't shift by one in a negative-offset timezone.
  function anMonthLabel(key){ return AN_MONTHS[Number(key.slice(5,7)) - 1] || key; }

  // The filters, applied once. Everything downstream works off this.
  function anRows(){
    if(!anData) return [];
    return anData.rows.filter(r => {
      if(anType !== 'all' && r.listingType !== anType) return false;
      if(anListingId !== 'all' && String(r.listingId) !== String(anListingId)) return false;
      if(anStatus !== 'all' && r.status !== anStatus) return false;
      return true;
    });
  }

  // 12 zeroed month slots for a year, then filled — so a month with no
  // bookings is a visible gap in the series rather than a missing bar
  // that silently shifts every later month leftwards.
  function anMonthSeries(year){
    const slots = [];
    for(let m = 1; m <= 12; m++){
      slots.push({ month: year + '-' + String(m).padStart(2,'0'),
                   current:0, upcoming:0, total:0, payout:0, bookings:0, nights:0 });
    }
    const byKey = {};
    slots.forEach(s => { byKey[s.month] = s; });
    anRows().forEach(r => {
      const s = byKey[r.month];
      if(!s) return;
      // Bars plot whichever metric is selected; bookings/nights stay
      // available alongside so the caption can report both regardless.
      const v = anMetric === 'bookings' ? r.bookings : r.payout;
      s[r.bucket] += v;
      s.total += v;
      s.payout += r.payout;
      s.bookings += r.bookings;
      s.nights += r.nights;
    });
    return slots;
  }

  function anYearTotals(year){
    const t = { current:0, upcoming:0, total:0, payout:0, bookings:0, nights:0 };
    anRows().forEach(r => {
      if(r.month.slice(0,4) !== String(year)) return;
      const v = anMetric === 'bookings' ? r.bookings : r.payout;
      t[r.bucket] += v; t.total += v;
      t.payout += r.payout; t.bookings += r.bookings; t.nights += r.nights;
    });
    return t;
  }

  // Stacked monthly bars, one stack per month, segments in past →
  // current → upcoming order so the realised money always sits at the
  // bottom and the speculative part on top.
  function anMonthChart(series){
    const W = 720, H = 210, padL = 48, padB = 26, padT = 12;
    const max = anNiceMax(Math.max(...series.map(s => Math.max(s.current, s.upcoming)), 1));
    const plotH = H - padB - padT, plotW = W - padL - 8;
    const slot = plotW / 12, bw = Math.min(slot * 0.30, 18);
    let grid = '', bars = '', labels = '';
    // Four gridlines rather than two — easier to read a mid-range bar
    // against, and the top line now sits above the tallest bar thanks to
    // anNiceMax, so nothing is flush against the frame.
    for(let g = 0; g <= 4; g++){
      const y = padT + plotH - (plotH/4)*g;
      grid += `<line x1="${padL}" y1="${y}" x2="${W-8}" y2="${y}" stroke="${g===0?'#ddd0bc':'#f3ebdd'}" stroke-width="1"></line>`;
      grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#8a7f6c">${anFmt(max*g/4)}</text>`;
    }
    series.forEach((s, i) => {
      const cx = padL + slot*i + slot/2;
      const isSel = anSelectedMonth === s.month;
      // Full-height hit area, so a month with a tiny bar (or none at all)
      // is still comfortably clickable.
      bars += `<rect class="an-hit" data-month="${s.month}" x="${cx-slot/2}" y="${padT}" width="${slot}" height="${plotH}" fill="${isSel ? 'rgba(138,108,57,0.10)' : 'transparent'}" style="cursor:pointer"></rect>`;
      // Side by side, not stacked: the two are answers to different
      // questions (money for nights already given vs nights still owed),
      // and a host compares them against each other rather than reading
      // their sum off the axis.
      AN_BUCKETS.forEach((b, bi) => {
        const v = s[b.key];
        const x = cx + (bi === 0 ? -bw - 1 : 1);
        if(v > 0){
          const h = (v/max)*plotH;
          bars += `<rect class="an-bar" data-month="${s.month}" data-tip="${anEsc(anMonthLabel(s.month) + ' ' + s.month.slice(0,4) + ' · ' + b.label + ' · ' + anFmtFull(v))}" x="${x}" y="${(padT+plotH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${b.color}" style="cursor:pointer" opacity="${anSelectedMonth && !isSel ? 0.4 : 1}"></rect>`;
        } else {
          bars += `<rect x="${x}" y="${padT+plotH-2}" width="${bw}" height="2" fill="#e8dcc8"></rect>`;
        }
      });
      labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="${isSel ? '#1c1a17' : '#8a7f6c'}" font-weight="${isSel ? '600' : '400'}" style="pointer-events:none">${anMonthLabel(s.month)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payout by month">${grid}${bars}${labels}</svg>`;
  }

  // Two years side by side, one pair of bars per month.
  function anCompareChart(yearA, yearB){
    const a = anMonthSeries(yearA), b = anMonthSeries(yearB);
    const W = 720, H = 210, padL = 48, padB = 26, padT = 12;
    const max = anNiceMax(Math.max(...a.map(s=>s.total), ...b.map(s=>s.total), 1));
    const plotH = H - padB - padT, plotW = W - padL - 8;
    const slot = plotW / 12, bw = Math.min(slot*0.30, 16);
    let grid = '', bars = '', labels = '';
    for(let g = 0; g <= 4; g++){
      const y = padT + plotH - (plotH/4)*g;
      grid += `<line x1="${padL}" y1="${y}" x2="${W-8}" y2="${y}" stroke="${g===0?'#ddd0bc':'#f3ebdd'}" stroke-width="1"></line>`;
      grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#8a7f6c">${anFmt(max*g/4)}</text>`;
    }
    for(let i = 0; i < 12; i++){
      const cx = padL + slot*i + slot/2;
      [[a[i], yearA, '#c2b49a', -1],[b[i], yearB, '#3a7d44', 1]].forEach(([s, yr, color, side]) => {
        const h = (s.total/max)*plotH;
        const x = cx + (side < 0 ? -bw-1 : 1);
        if(s.total > 0){
          bars += `<rect class="an-bar" data-tip="${anEsc(anMonthLabel(s.month) + ' ' + yr + ' · ' + anFmtFull(s.total))}" x="${x}" y="${(padT+plotH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${color}"></rect>`;
        } else {
          bars += `<rect x="${x}" y="${padT+plotH-2}" width="${bw}" height="2" fill="#e8dcc8"></rect>`;
        }
      });
      labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8a7f6c">${AN_MONTHS[i]}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Year comparison">${grid}${bars}${labels}</svg>`;
  }

  // Per-listing breakdown for whatever is currently in scope — the whole
  // year, or just the clicked month.
  function anListingBreakdown(year, monthKey){
    const agg = {};
    anRows().forEach(r => {
      if(monthKey ? r.month !== monthKey : r.month.slice(0,4) !== String(year)) return;
      const k = r.listingId;
      if(!agg[k]) agg[k] = { name:r.listingName, type:r.listingType, payout:0, gross:0, bookings:0, nights:0 };
      agg[k].payout += r.payout; agg[k].gross += r.gross;
      agg[k].bookings += r.bookings; agg[k].nights += r.nights;
    });
    const list = Object.values(agg).sort((x,y) => y.payout - x.payout);
    if(!list.length) return '<p class="an-empty">No bookings in this period.</p>';
    const max = Math.max(...list.map(l => l.payout), 1);
    const rowH = 30, W = 720, padLl = 150, padR = 86;
    const H = Math.max(list.length*rowH + 10, 40);
    const plotW = W - padLl - padR;
    let out = '';
    list.forEach((l, i) => {
      const y = i*rowH + 6;
      const w = (l.payout/max)*plotW;
      const nm = l.name && l.name.length > 22 ? l.name.slice(0,21) + '…' : (l.name || 'Untitled');
      out += `<text x="${padLl-8}" y="${y+14}" text-anchor="end" font-size="11" fill="#1c1a17">${anEsc(nm)}</text>`;
      out += `<rect class="an-bar" data-tip="${anEsc(l.name + ' · ' + anMoneyFull(l.payout) + ' · ' + l.bookings + (l.bookings===1?' booking':' bookings') + ' · ' + l.nights + (l.nights===1?' night':' nights'))}" x="${padLl}" y="${y+3}" width="${Math.max(w,2).toFixed(1)}" height="15" rx="2" fill="${l.type === 'experience' ? '#8a6c39' : '#3a7d44'}"></rect>`;
      out += `<text x="${padLl+Math.max(w,2)+7}" y="${y+15}" font-size="10" fill="#8a7f6c">${anMoney(l.payout)} · ${l.bookings} bkg</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payout by listing">${out}</svg>`;
  }

  function anTotalsStrip(t, caption){
    return `<p class="an-sub">${anEsc(caption)}</p><div class="an-totals">
      ${AN_BUCKETS.map(b => `<div class="an-total"><span class="an-label"><i class="an-swatch" style="background:${b.color}"></i>${b.label}</span><span class="an-value">${anFmt(t[b.key])}</span></div>`).join('')}
      <div class="an-total"><span class="an-label">${anMetric === 'bookings' ? 'Total bookings' : 'Total payout'}</span><span class="an-value payout-value">${anFmt(t.total)}</span></div>
    </div>`;
  }

  // A real hover tooltip. SVG <title> works but waits for the browser's
  // own ~1s delay and can't be styled, which made reading a chart feel
  // broken. This follows the pointer, and is bound after every render
  // because innerHTML replaces the nodes each time.
  function anBindTooltip(box){
    let tip = document.getElementById('anTooltip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'anTooltip';
      tip.className = 'an-tooltip';
      document.body.appendChild(tip);
    }
    const hide = () => { tip.style.opacity = '0'; };
    box.querySelectorAll('.an-bar').forEach(el => {
      el.addEventListener('mouseenter', () => {
        tip.textContent = el.getAttribute('data-tip') || '';
        tip.style.opacity = '1';
      });
      el.addEventListener('mousemove', (e) => {
        // Clamped to the viewport so a bar near the right edge doesn't
        // push the tooltip off-screen.
        const w = tip.offsetWidth || 160;
        const x = Math.min(e.clientX + 14, window.innerWidth - w - 10);
        tip.style.left = Math.max(8, x) + 'px';
        tip.style.top = (e.clientY - 34) + 'px';
      });
      el.addEventListener('mouseleave', hide);
    });
    box.addEventListener('mouseleave', hide);
  }

  function anRender(){
    const box = document.getElementById('analyticsContainer');
    if(!anData) return;
    const years = anData.years || [];
    const listings = (anData.listings || []).filter(l => anType === 'all' || l.type === anType);

    const controls = `<div class="an-controls">
      <div class="an-toggle">
        ${[['all','All'],['stay','Stays'],['experience','Experiences']].map(([v,l]) =>
          `<button type="button" data-an-type="${v}" class="${anType===v?'on':''}">${l}</button>`).join('')}
      </div>
      <div class="an-toggle">
        ${years.map(y => `<button type="button" data-an-year="${y}" class="${String(anYear)===String(y)?'on':''}">${y}</button>`).join('')}
        ${years.length === 2 ? `<button type="button" data-an-year="compare" class="${anYear==='compare'?'on':''}">Compare</button>` : ''}
      </div>
      <select class="an-select" id="anListingSelect" aria-label="Filter by listing">
        <option value="all">All listings</option>
        ${listings.map(l => `<option value="${l.id}" ${String(anListingId)===String(l.id)?'selected':''}>${anEsc(l.name)}</option>`).join('')}
      </select>
      <select class="an-select" id="anStatusSelect" aria-label="Filter by booking status">
        ${[['paid','Confirmed bookings'],['all','All bookings'],['cancelled','Cancelled only'],['refunded','Refunded only']]
          .map(([v,l]) => `<option value="${v}" ${anStatus===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <div class="an-toggle an-metric">
        ${[['payout','₹ Payout'],['bookings','# Bookings']].map(([v,l]) =>
          `<button type="button" data-an-metric="${v}" class="${anMetric===v?'on':''}">${l}</button>`).join('')}
      </div>
    </div>`;

    let body;
    if(anYear === 'compare'){
      const [yA, yB] = years;
      const tA = anYearTotals(yA), tB = anYearTotals(yB);
      const diff = tB.total - tA.total;
      const pct = tA.total > 0 ? Math.round((diff/tA.total)*100) : null;
      body = `<div class="an-card"><h4>${yA} vs ${yB}</h4>
        <p class="an-sub">Total payout per month, both years side by side.</p>
        ${anCompareChart(yA, yB)}
        <div class="an-legend">
          <span><i class="an-swatch" style="background:#c2b49a"></i>${yA} — ${anMoney(tA.total)}</span>
          <span><i class="an-swatch" style="background:#3a7d44"></i>${yB} — ${anMoney(tB.total)}</span>
          <span style="color:${diff>=0?'#3a7d44':'#a3402f'}">${diff>=0?'▲':'▼'} ${anMoney(Math.abs(diff))}${pct!==null?` (${diff>=0?'+':'−'}${Math.abs(pct)}%)`:''}</span>
        </div></div>`;
    } else {
      const series = anMonthSeries(anYear);
      const sel = anSelectedMonth && anSelectedMonth.slice(0,4) === String(anYear)
        ? series.find(s => s.month === anSelectedMonth) : null;
      const scopeTotals = sel
        ? { current:sel.current, upcoming:sel.upcoming, total:sel.total, bookings:sel.bookings, nights:sel.nights }
        : anYearTotals(anYear);
      const statusWord = { paid:'confirmed', all:'', cancelled:'cancelled', refunded:'refunded' }[anStatus];
      const scopeLabel = sel ? `${anMonthLabel(sel.month)} ${anYear}` : String(anYear);
      const caption = `${scopeLabel} — ${scopeTotals.bookings} ${statusWord ? statusWord + ' ' : ''}booking${scopeTotals.bookings===1?'':'s'}`
        + `, ${scopeTotals.nights} night${scopeTotals.nights===1?'':'s'}`
        + `, ${anMoneyFull(scopeTotals.payout)} paid out`;
      body = anTotalsStrip(scopeTotals, caption)
        + `<div class="an-card"><h4>${anMetric === 'bookings' ? 'Bookings' : 'Payout'} by booking month</h4>
           <p class="an-sub">Counted in the month you were paid, split by whether the stay has happened yet. Tap a month for its own numbers.${sel?' <button type="button" class="an-clear" id="anClearMonth">Show whole year</button>':''}</p>
           ${anMonthChart(series)}
           <div class="an-legend">${AN_BUCKETS.map(b=>`<span><i class="an-swatch" style="background:${b.color}"></i>${b.label}</span>`).join('')}</div>
           </div>`
        + `<div class="an-card"><h4>By listing${sel?' — '+anMonthLabel(sel.month)+' '+anYear:''}</h4>
           <p class="an-sub">Payout, highest first.</p>
           ${anListingBreakdown(anYear, sel ? sel.month : null)}</div>`;
    }

    box.innerHTML = controls + body;

    box.querySelectorAll('[data-an-type]').forEach(b => b.addEventListener('click', () => {
      anType = b.dataset.anType;
      // A listing filter pinned to something the new type filter hides
      // would silently produce an empty view with no obvious cause.
      const still = (anData.listings||[]).some(l => String(l.id)===String(anListingId) && (anType==='all'||l.type===anType));
      if(!still) anListingId = 'all';
      anRender(); renderBookings();
    }));
    box.querySelectorAll('[data-an-year]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.anYear;
      anYear = v === 'compare' ? 'compare' : Number(v);
      if(anYear === 'compare') anSelectedMonth = null;
      // Asking the chart for a year is asking for that year's earnings.
      // 'Compare' spans both, so it leaves the table where it was.
      if(anYear !== 'compare') earnScope = { kind:'year', year: anYear };
      anRender(); renderBookings();
    }));
    const sel = document.getElementById('anListingSelect');
    if(sel) sel.addEventListener('change', () => { anListingId = sel.value; anRender(); renderBookings(); });
    const stSel = document.getElementById('anStatusSelect');
    if(stSel) stSel.addEventListener('change', () => { anStatus = stSel.value; anRender(); });  // the table has its own Earned / Cancelled tabs
    box.querySelectorAll('[data-an-metric]').forEach(b => b.addEventListener('click', () => {
      // Payout vs bookings is how the bars are drawn, not which bookings
      // they are — the table below is unchanged by it.
      anMetric = b.dataset.anMetric; anRender();
    }));
    anBindTooltip(box);
    const clr = document.getElementById('anClearMonth');
    if(clr) clr.addEventListener('click', () => {
      anSelectedMonth = null;
      earnScope = { kind:'year', year: anYear };
      anRender(); renderBookings();
    });
    // Clicking a month on the chart is the main way into this page's
    // detail: the bars answer "how much", the table underneath answers
    // "from which bookings", and they should never disagree.
    box.querySelectorAll('svg [data-month]').forEach(el => el.addEventListener('click', () => {
      const m = el.getAttribute('data-month');
      anSelectedMonth = (anSelectedMonth === m) ? null : m;  // click again to clear
      earnScope = anSelectedMonth
        ? { kind:'month', month: anSelectedMonth }
        : { kind:'year', year: anYear };
      anRender(); renderBookings();
    }));
  }

  async function loadAnalytics(){
    const box = document.getElementById('analyticsContainer');
    if(!box) return;
    try{
      const res = await fetch(API_BASE + '/api/host-listings?analytics=1', {
        headers: { 'Authorization': 'Bearer ' + sessionToken }
      });
      if(!res.ok) throw new Error('failed');
      const d = await res.json();
      // `rows` is the marker that this really is an analytics reply. An
      // older deployment of host-listings.js ignores ?analytics=1 and
      // falls through to its normal GET, whose payload would otherwise be
      // accepted and rendered as an empty chart rather than an error.
      if(!Array.isArray(d.rows) || !Array.isArray(d.years)){
        box.innerHTML = '<p class="an-empty">Analytics isn’t available right now. Please try again later.</p>';
        return;
      }
      anData = d;
      anYear = d.years[d.years.length - 1];
      if(!d.listings || !d.listings.length){
        box.innerHTML = '<p class="an-empty">Analytics appear here once you have an approved listing.</p>';
        return;
      }
      anRender();
    }catch(err){
      console.error('analytics load failed:', err);
      box.innerHTML = '<p class="an-empty">Could not load your analytics. Please refresh.</p>';
    }
  }

  loadEarnings();
  loadAnalytics();
</script>

<script>
// Guest cancellation requests. Each shows only the choice for that
// booking (server: host-listings cancellationRequests / _cancellations.js).
async function loadCancellationRequests(){
  const token = (function(){ try{ return localStorage.getItem('aerva_guest_session'); }catch(e){ return null; } })();
  if(!token) return;
  const acting = (window.AervaCohost && typeof window.AervaCohost.get === 'function') ? window.AervaCohost.get() : null;
  const q = acting && acting.hostId ? '&actingHost=' + encodeURIComponent(acting.hostId) : '';
  try{
    const res = await fetch('https://aerva-in.vercel.app/api/host-listings?cancellationRequests=1' + q, { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await res.json();
    const list = (res.ok && data.requests) || [];
    let box = document.getElementById('cancelRequestsSection');
    if(!list.length){ if(box) box.remove(); return; }
    if(!box){
      box = document.createElement('section');
      box.id = 'cancelRequestsSection';
      box.style.cssText = 'margin:0 0 28px; background:#fff; border:1px solid #ece4d8; border-left:3px solid #a3402f; border-radius:12px; padding:16px 18px;';
      const wrap = document.querySelector('.wrap') || document.body;
      wrap.insertBefore(box, wrap.firstChild);
    }
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const day = (v) => { const d = new Date(String(v).slice(0, 10) + 'T00:00:00Z'); return isNaN(d) ? '' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' }); };
    box.innerHTML = '<h2 style="font-family:\'Bodoni Moda\', Georgia, serif; font-weight:500; font-size:22px; margin:0 0 6px;">Cancellation requests</h2>'
      + list.map(r => `<div style="padding:12px 0; border-top:1px solid #f0e9df; font-size:14.5px;" data-req="${Number(r.id)}">
          <strong>${esc(r.guestName)}</strong> · ${esc(r.listing)} · ${esc(day(r.arrival))} – ${esc(day(r.departure))}${r.daysBefore != null ? ' · ' + (r.daysBefore === 0 ? 'check-in today' : r.daysBefore === 1 ? 'check-in tomorrow' : r.daysBefore + ' days before check-in') : ''}<br>
          <span>${esc(r.reason)}</span>${r.details ? `<br><span style="opacity:0.75;">${esc(r.details)}</span>` : ''}
          ${r.option && r.option.type === 'choose'
            ? `<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
                 <label style="font-size:13px;">Refund <input type="number" min="0" max="100" step="1" value="0" data-pct="${Number(r.id)}" style="width:70px; padding:6px; border:1px solid #d9cfc2; border-radius:6px; font-size:16px;"> %</label>
                 <button type="button" class="btn-small" data-choose="${Number(r.id)}">Confirm</button>
                 <button type="button" class="dispute-btn" data-decline="${Number(r.id)}">Reject</button>
               </div>`
            : `<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
                 <span style="font-size:13px; opacity:0.8;">Guest gets back ₹${Math.round(Number(r.guestGetsBack) || 0).toLocaleString('en-IN')}</span>
                 <button type="button" class="btn-small" data-accept="${Number(r.id)}">Accept</button>
                 <button type="button" class="dispute-btn" data-decline="${Number(r.id)}">Reject</button>
               </div>`}
          </div>`).join('');
    const answer = async (id, accept, refundPercent) => {
      if(!confirm(accept ? 'Confirm your answer? This cannot be undone.' : 'Reject this request?')) return;
      const r = await fetch('https://aerva-in.vercel.app/api/host-listings' + (q ? '?' + q.slice(1) : ''), { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ respondCancellationRequest: { requestId: id, accept, refundPercent } }) });
      const d = await r.json().catch(() => ({}));
      if(!r.ok){ alert(d.error || 'Could not answer this request.'); return; }
      loadCancellationRequests(); if(typeof loadListings === 'function') loadListings();
    };
    box.querySelectorAll('[data-accept]').forEach(b => b.addEventListener('click', () => answer(Number(b.dataset.accept), true)));
    box.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', () => answer(Number(b.dataset.decline), false)));
    box.querySelectorAll('[data-choose]').forEach(b => b.addEventListener('click', () => {
      const id = Number(b.dataset.choose);
      const input = box.querySelector('[data-pct="' + id + '"]');
      const pct = Math.round(Number(input && input.value));
      if(!(pct >= 0 && pct <= 100)){ alert('Enter a refund between 0 and 100%.'); return; }
      answer(id, true, pct);
    }));
  }catch(err){ /* leave the page as it is */ }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadCancellationRequests); else loadCancellationRequests();
</script>

    const list = (res.ok && data.changes) || [];

        body: JSON.stringify({ respondBookingChange: { changeId: id, accept } }) });

    box.querySelectorAll('[data-ch-reject]').forEach(b => b.addEventListener('click', () => answer(Number(b.dataset.chReject), false)));
