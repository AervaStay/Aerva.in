<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Login — Aerva</title>
<meta name="robots" content="noindex, nofollow">
<!--
  host-login.html is retired. Hosts are just guest accounts with a linked
  hosts row (guests.host_id) — see host-dashboard.html, which already
  authenticates against host-listings.js using the same aerva_guest_session
  token that guest-auth.js issues. There's no separate host password or
  magic-link system anymore (the old /api/host-auth endpoint this page
  used to call is gone), so this page just sends hosts to the one real
  login page. A meta-refresh + JS redirect covers both no-JS and JS cases.
-->
<meta http-equiv="refresh" content="0; url=guest-login.html">
<style>
  body{font-family:'Jost', sans-serif; background:#f4ebe3; color:#1c1a17; margin:0; padding:60px 20px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:400px; margin:0 auto; text-align:center;}
  p{opacity:0.65; font-size:14px;}
  a{color:#8a6c39;}
</style>
</head>
<body>

<div class="wrap">
  <p>Redirecting you to <a href="guest-login.html">Aerva login</a>&hellip;</p>
</div>

<script>
  window.location.replace('guest-login.html');
</script>

</body>
</html>
