<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payout details — Aerva</title>
<script src="aerva-env.js?v=2026-10-09b"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f4ebe3'/><text x='50' y='68' font-family='Georgia,serif' font-size='60' text-anchor='middle' fill='%23A9885A'>A</text></svg>">
<meta name="robots" content="noindex, nofollow">
<!--
  host-payouts.html — Payout details: who is paid (the host or someone
  else), their PAN (optional) and their bank account, and the payouts
  already sent. A co-host's details are in the Co-hosting centre.
-->
<style>
  body{font-family:'Jost', sans-serif; background:#ffffff; color:#1c1a17; margin:0; padding:40px 20px; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  .wrap{max-width:760px; margin:0 auto;}
  .back-home{display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#1c1a17; opacity:0.6; text-decoration:none; margin-bottom:20px;}
  .back-home:hover{opacity:1;}
  h1{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:32px; margin:0 0 6px;}
  .lead{font-size:14.5px; opacity:0.75; margin:0 0 26px; line-height:1.6;}
  .card{background:#fff; border:1px solid #ece4d8; border-radius:12px; padding:18px 20px; margin:0 0 22px;}
  .card h2{font-family:'Bodoni Moda', Georgia, serif; font-weight:500; font-size:22px; margin:0 0 10px;}
  .warn{background:#fbf6ee; border:1px solid #eadcc4; border-radius:10px; padding:12px 14px; font-size:13.5px; line-height:1.6; color:#5c4a2c; margin:0 0 14px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:12px 0; border-top:1px solid #f0e9df;}
  .row:first-of-type{border-top:none;}
  .row-label{font-size:12px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.6;}
  .row-value{font-size:15px; margin-top:3px; word-break:break-word;}
  .status{font-size:12px; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:#f1ece4; white-space:nowrap;}
  .status-approved{background:#e5f1e6; color:#2f6b37;}
  .status-rejected{background:#f8e4e0; color:#a3402f;}
  .status-pending{background:#fbf1dc; color:#8a6c39;}
  .note{font-size:13.5px; opacity:0.75; line-height:1.55; margin:8px 0 0;}
  .note.bad{color:#a3402f; opacity:1;}
  .btn-line{box-sizing:border-box; background:none; border:1px solid #d9cfc2; border-radius:999px; padding:10px 18px; cursor:pointer; font:inherit; font-size:14px; min-height:44px; color:#1c1a17; text-decoration:none; display:inline-flex; align-items:center; white-space:nowrap; line-height:1.2;}
  .btn-solid{background:#1c1a17; color:#fff; border:none; border-radius:999px; padding:11px 20px; cursor:pointer; font:inherit; font-size:14px; min-height:44px;}
  .btn-solid:disabled{opacity:0.6; cursor:default;}
  .field{margin:0 0 14px;}
  .field label{display:block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.7; margin-bottom:6px;}
  .field input{width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #d9cfc2; border-radius:8px; font:inherit; font-size:16px; background:#fff;}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  #bankForm{display:none; margin-top:14px; padding-top:14px; border-top:1px solid #f0e9df;}
  .msg{font-size:13.5px; margin:10px 0 0; min-height:18px;}
  .payout{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid #f0e9df; color:inherit; text-decoration:none; font-size:14.5px;}
  .payout:first-of-type{border-top:none;}
  .payout .sub{opacity:0.7;}
  .payout .when{opacity:0.7; text-align:right; flex:0 0 auto;}
  .loading, .empty{font-size:14px; opacity:0.7;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  .opt{text-transform:none; letter-spacing:0; opacity:0.8;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg label{white-space:nowrap; display:inline-flex; align-items:center; gap:8px; border:1px solid #d9cfc2; border-radius:999px; padding:9px 16px; font-size:14px; letter-spacing:0; text-transform:none; opacity:1; cursor:pointer; margin:0;}
  .seg label:has(input:checked){border-color:#1c1a17; background:#faf6ef;}
  .field input[type=file]{padding:9px; font-size:14px;}
  .field input[readonly]{background:#f4efe7; color:#4a443c;}
  @media (max-width:600px){
    .two{grid-template-columns:1fr;}
    body{padding:28px 16px;}
    h1{font-size:27px;}
    .row{flex-wrap:wrap;}
    .payout{flex-direction:column; gap:4px;}
    .payout .when{text-align:left;}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aerva-header.css?v=2026-10-10a">
<script src="aerva-cohost.js"></script>
<script src="aerva-bank-fields.js?v=2026-10-13a"></script>
</head>
<body>

<div class="wrap">
  <a href="host-earnings.html" class="back-home">&larr; My Earnings</a>
  <h1>Payout details</h1>
  <p class="lead">Where Aerva sends your earnings, and the payouts already sent.</p>

  <div id="payoutsBody"><p class="loading">Loading…</p></div>
</div>

<script>
(function(){
  const API = (window.AERVA_API || 'https://aerva-in.vercel.app') + '/api/host-listings';
  const token = (function(){ try{ return localStorage.getItem('aerva_guest_session'); }catch(e){ return null; } })();
  const body = document.getElementById('payoutsBody');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const statusLabel = (s) => ({ approved: 'Approved', rejected: 'Needs attention', pending: 'Being checked', not_submitted: 'Not added' }[s] || (s ? String(s).replace(/_/g, ' ') : 'Not added'));
  const inr = (n) => '\u20b9' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const day = (v) => { const d = new Date(String(v).slice(0, 10) + 'T00:00:00Z'); return isNaN(d) ? '' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); };

  if(!token){ window.location.replace('guest-login.html'); return; }
  // A co-host's own bank details are kept with their co-hosting.
  const IS_COHOST = !!(window.AervaCohost && typeof window.AervaCohost.get === 'function' && window.AervaCohost.get());

  async function load(){
    let v = null;
    try{
      const res = await fetch(API, { headers: { 'Authorization': 'Bearer ' + token } });
      if(res.status === 401){ try{ localStorage.removeItem('aerva_guest_session'); }catch(e){} window.location.replace('guest-login.html'); return; }
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'failed');
      v = data.verification || null;
    }catch(err){
      body.innerHTML = '<p class="empty">Could not load your payout details. Please refresh.</p>';
      return;
    }
    if(IS_COHOST || !v){
      // Not a host here: only the co-host's own payout details (if any).
      body.innerHTML = '<div id="coBox"></div><div id="sentBox"></div>';
      const isCo = await loadCohostPayout();
      if(!isCo) $('coBox').innerHTML = '<div class="card"><h2>Bank account</h2><p class="note">Your payout details are added once you list a home, or once you co-host for someone.</p></div>';
      loadSent();
      return;
    }
    const s = v.bankStatus || 'not_submitted';
    const cls = s === 'approved' ? 'status-approved' : s === 'rejected' ? 'status-rejected' : s === 'pending' ? 'status-pending' : '';
    // Who is paid: one person (or business) — the host or someone else —
    // whose name, PAN and bank account must all be the same. Once a PAN is
    // on file the name is the name on that PAN and cannot be changed here.
    const panOnFile = !!v.panSubmitted;
    const lockedName = panOnFile ? (v.panName || '') : '';
    // The payout name on file: the PAN's name, or (without a PAN) the name given.
    const currentName = lockedName || v.bankAccountHolderName || '';
    const words = currentName.trim().split(/\s+/).filter(Boolean);
    const lockedFirst = words.length > 1 ? words.slice(0, -1).join(' ') : '';
    const lockedLast = words.length ? words[words.length - 1] : '';
    const bc = v.bankCheck || null;
    body.innerHTML = `
      <div class="card">
        <h2>Who is paid</h2>
        <p class="note" style="margin:0 0 12px;">Payouts go to one person or business — you, or someone else such as a family member or your company. Enter their name exactly as their bank account holds it. If you add a PAN, it must be in that same name.</p>
        <div class="row">
          <div><div class="row-label">Payout name</div><div class="row-value">${currentName ? esc(currentName) : 'Not added yet'}</div></div>
          ${v.panNumberMasked ? `<div style="text-align:right;"><div class="row-label">PAN</div><div class="row-value">${esc(v.panNumberMasked)}</div></div>` : ''}
        </div>
        <div class="row">
          <div><div class="row-label">Bank account</div>
            <div class="row-value" id="bankNote">${v.bankAccountNumberMasked ? esc(v.bankAccountNumberMasked) + (v.bankIfsc ? ' · ' + esc(v.bankIfsc) : '') : 'No bank details on file yet.'}</div></div>
          <span class="status ${cls}">${esc(statusLabel(s))}</span>
        </div>
        ${s === 'rejected' && v.bankRejectionReason ? `<p class="note bad">${esc(v.bankRejectionReason)}</p>` : ''}
        ${bc && bc.message && s !== 'rejected' ? `<p class="note">${esc(bc.message)}</p>` : ''}
        ${v.bankPayoutsFrom ? `<p class="note">Bank details changed recently: payouts resume from ${esc(new Date(v.bankPayoutsFrom).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}.</p>` : ''}
        <div class="actions" style="margin-top:14px;">
          <button type="button" class="btn-line" id="bankEditBtn">${v.bankAccountNumberMasked ? 'Change bank account' : 'Add payout details'}</button>
          <a class="btn-line" href="host-dashboard.html?openProfile=1&profileTab=verification">Aadhaar verification</a>
        </div>
        <div id="bankForm">
          <div class="warn">Changing these details puts payouts on hold until the new account is verified, and for at least 48 hours. You will get an email about the change.</div>
          ${panOnFile && !lockedName ? `<p class="note bad" style="margin:0 0 12px;">First add the name exactly as printed on your PAN card, under <a href="host-dashboard.html?openProfile=1&profileTab=verification">Verification</a>. The bank account is checked against it.</p>` : ''}${panOnFile ? `<p class="note" style="margin:0 0 12px;">Payouts go to <strong>${esc(lockedName || 'the PAN holder')}</strong>, the name on the PAN on file. A new account must be held in that name. To pay a different person, write to hello@aerva.in.</p>` : `
          <div class="field" role="radiogroup" aria-label="Paid to">
            <label style="margin-bottom:8px;">Paid to</label>
            <div class="seg">
              <label><input type="radio" name="payeeType" value="person" checked> A person</label>
              <label><input type="radio" name="payeeType" value="business"> A business</label>
            </div>
          </div>`}
          <div id="personFields">
            <div class="two">
              <div class="field"><label for="payeeFirst">First name <span class="opt">(and middle name)</span></label>
                <input type="text" id="payeeFirst" autocomplete="given-name" value="${esc(lockedFirst)}" ${panOnFile ? 'readonly' : ''} placeholder="As the bank account holds it"></div>
              <div class="field"><label for="payeeLast">Last name <span class="opt">(surname)</span></label>
                <input type="text" id="payeeLast" autocomplete="family-name" value="${esc(lockedLast)}" ${panOnFile ? 'readonly' : ''} placeholder="As the bank account holds it"></div>
            </div>
          </div>
          <div id="businessFields" style="display:none;">
            <div class="field"><label for="payeeBusiness">Business name <span class="opt">(as on its PAN)</span></label>
              <input type="text" id="payeeBusiness" autocomplete="organization" placeholder="e.g. Sharma Hospitality Private Limited"></div>
          </div>
          ${panOnFile ? '' : `
          <div class="two">
            <div class="field"><label for="payeePan">PAN <span class="opt">(optional)</span></label>
              <input type="text" id="payeePan" maxlength="10" autocomplete="off" style="text-transform:uppercase;" placeholder="e.g. ABCPS1234K"></div>
            <div class="field" id="panFileField" style="display:none;"><label for="payeePanFile">Photo or PDF of the PAN card</label>
              <input type="file" id="payeePanFile" accept="image/*,.pdf"></div>
          </div>
          <p class="note" style="margin:-4px 0 14px;">Without a PAN, 5% TDS is deducted from payouts; with one, 0.1%. It must be in the same name as above.</p>`}
          <div class="field"><label for="bankAccount">Bank account number</label>
            <input type="text" id="bankAccount" placeholder="Account number" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label for="bankAccount2">Re-enter account number</label>
            <input type="text" id="bankAccount2" placeholder="The same number again" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label for="bankIfsc">IFSC code</label>
            <input type="text" id="bankIfsc" placeholder="e.g. HDFC0001234" autocomplete="off"></div>
          <div class="field" id="gstinField"><label for="bankGstin">GSTIN <span class="opt">(only for an account in a trading name on a personal PAN)</span></label>
            <input type="text" id="bankGstin" placeholder="e.g. 27ABCPS1234K1ZM" maxlength="15" style="text-transform:uppercase;" autocomplete="off"></div>
          <div class="actions">
            <button type="button" class="btn-solid" id="bankSaveBtn">Save</button>
            <button type="button" class="btn-line" id="bankCancelBtn">Cancel</button>
          </div>
          <p class="msg" id="bankMsg"></p>
        </div>
      </div>
      <div id="coBox"></div>
      <div id="sentBox"></div>`;
    const form = document.getElementById('bankForm');
    document.getElementById('bankEditBtn').addEventListener('click', () => { form.style.display = form.style.display === 'block' ? 'none' : 'block'; });
    document.getElementById('bankCancelBtn').addEventListener('click', () => { form.style.display = 'none'; });
    document.getElementById('bankSaveBtn').addEventListener('click', save);
    payee = { panOnFile, lockedName, panLetter: (v.panNumberMasked || '').charAt(4) };
    bankForm = window.AervaBankFields ? window.AervaBankFields.wire({
      account: document.getElementById('bankAccount'), account2: document.getElementById('bankAccount2'),
      ifsc: document.getElementById('bankIfsc'), gstin: document.getElementById('bankGstin')
    }) : null;
    wirePayee();
    loadCohostPayout();
    loadSent();
  }

  // ---- The payee: name and (optional) PAN, checked as they are typed ----
  let payee = null;
  const PAN_RE = /^[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]$/;
  const $ = (id) => document.getElementById(id);
  function payeeType(){ const r = document.querySelector('input[name="payeeType"]:checked'); return r ? r.value : 'person'; }
  function payeeName(){
    if(payee && payee.panOnFile) return payee.lockedName;
    if(payeeType() === 'business') return ($('payeeBusiness').value || '').replace(/\s+/g, ' ').trim();
    return [$('payeeFirst').value, $('payeeLast').value].map(x => String(x || '').replace(/\s+/g, ' ').trim()).filter(Boolean).join(' ');
  }
  function hint(el, state, text){
    if(!el) return;
    let h = el.parentNode.querySelector('.abf-hint');
    if(!h){ h = document.createElement('span'); h.className = 'abf-hint'; h.setAttribute('aria-live', 'polite'); el.after(h); }
    h.textContent = text || ''; h.className = 'abf-hint' + (state === 'bad' ? ' is-bad' : state === 'good' ? ' is-good' : '');
    el.classList.toggle('abf-bad', state === 'bad'); el.classList.toggle('abf-good', state === 'good');
  }
  const NO_MATCH = 'The PAN and the name do not match. Check both against the PAN card.';
  function panFits(pan, type, last, biz){
    const k = pan.charAt(3), f = pan.charAt(4);
    if(type === 'person') return k === 'P' && !!last && f === last.charAt(0).toUpperCase();
    const n = biz.replace(/^(M\/S\.?|THE)\s+/i, '');
    return k !== 'P' && !!n && f === n.charAt(0).toUpperCase();
  }
  function payeeOk(touch){
    if(payee && payee.panOnFile) return true;
    const type = payeeType();
    const pan = ($('payeePan').value || '').toUpperCase();
    const first = ($('payeeFirst').value || '').trim(), last = ($('payeeLast').value || '').trim();
    const biz = ($('payeeBusiness').value || '').trim();
    let ok = true;
    if(type === 'person'){
      if(first.length < 1){ ok = false; hint($('payeeFirst'), touch.first ? 'bad' : '', touch.first ? 'Enter the first name as the bank account holds it.' : ''); } else hint($('payeeFirst'), '', '');
      if(last.length < 1){ ok = false; hint($('payeeLast'), touch.last ? 'bad' : '', touch.last ? 'Enter the last name as the bank account holds it.' : ''); } else hint($('payeeLast'), '', '');
    } else if(biz.length < 3){ ok = false; hint($('payeeBusiness'), touch.biz ? 'bad' : '', touch.biz ? 'Enter the business name as its bank account holds it.' : ''); } else hint($('payeeBusiness'), '', '');
    // The PAN is optional; a card photo is needed only with one.
    $('panFileField').style.display = pan ? 'block' : 'none';
    const named = type === 'person' ? last : biz;
    if(!pan){ hint($('payeePan'), '', ''); }
    else if(!PAN_RE.test(pan)){ ok = false; hint($('payeePan'), pan.length === 10 || touch.pan ? 'bad' : '', 'Enter a valid PAN, like ABCPS1234K.'); }
    else if(named && !panFits(pan, type, last, biz)){ ok = false; hint($('payeePan'), 'bad', NO_MATCH); }
    else hint($('payeePan'), named ? 'good' : '', named ? '✓' : '');
    if(pan){
      if(!($('payeePanFile').files || [])[0]){ ok = false; hint($('payeePanFile'), touch.file ? 'bad' : '', touch.file ? 'Add a photo or PDF of the PAN card.' : 'Seen only by Aerva, then deleted.'); }
      else hint($('payeePanFile'), 'good', '✓ ' + $('payeePanFile').files[0].name);
    }
    return ok;
  }
  let touched = {};
  function refresh(all){
    if(all) touched = { first: true, last: true, biz: true, pan: true, file: true };
    const a = payeeOk(touched), b = bankForm ? bankForm.refresh() : true;
    const btn = $('bankSaveBtn'); if(btn && btn.textContent === 'Save') btn.disabled = !(a && b);
    return a && b;
  }
  function wirePayee(){
    const sync = () => {
      const biz = payeeType() === 'business';
      // With a PAN on file the payout name is that PAN's name, shown above.
      $('personFields').style.display = payee.panOnFile || biz ? 'none' : 'block';
      $('businessFields').style.display = !payee.panOnFile && biz ? 'block' : 'none';
      refresh();
    };
    document.querySelectorAll('input[name="payeeType"]').forEach(r => r.addEventListener('change', sync));
    [['payeeFirst', 'first'], ['payeeLast', 'last'], ['payeeBusiness', 'biz'], ['payeePan', 'pan'], ['payeePanFile', 'file']].forEach(([id, k]) => {
      const el = $(id); if(!el || el.readOnly) return;
      if(id === 'payeePan') el.addEventListener('input', () => { el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10); });
      el.addEventListener('input', () => refresh());
      el.addEventListener('change', () => { touched[k] = true; refresh(); });
      el.addEventListener('blur', () => { touched[k] = true; refresh(); });
    });
    ['bankAccount', 'bankAccount2', 'bankIfsc', 'bankGstin'].forEach(id => { const el = $(id); if(el){ el.addEventListener('input', () => setTimeout(refresh, 0)); el.addEventListener('blur', () => setTimeout(refresh, 0)); } });
    // The bank and branch arrive a moment after the IFSC is typed.
    setInterval(() => { if($('bankForm') && $('bankForm').style.display === 'block') refresh(); }, 700);
    sync();
  }

  let bankForm = null;
  async function save(){
    const btn = $('bankSaveBtn');
    const msg = $('bankMsg');
    const bad = (t) => { msg.textContent = t; msg.style.color = '#a3402f'; };
    msg.textContent = '';
    if(!refresh(true) || (bankForm && !bankForm.valid())) return bad('Please correct the fields marked in red.');
    const name = payeeName();
    const bankAccountNumber = $('bankAccount').value.trim();
    const bankAccountNumber2 = $('bankAccount2').value.trim();
    const bankIfsc = $('bankIfsc').value.trim();
    const bankGstin = ($('bankGstin').value || '').trim().toUpperCase();
    if(!name || !bankAccountNumber || !bankIfsc) return bad('Please fill in all the fields.');
    if(!confirm('Save these payout details? Payouts will go to ' + name + ' once the account is verified, and wait at least 48 hours after any change.')) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    const done = (t) => { if(t) bad(t); btn.textContent = 'Save'; refresh(); };
    try{
      const payload = { bankAccountHolderName: name, bankAccountNumber, bankAccountNumberConfirm: bankAccountNumber2, bankIfsc, bankGstin: bankGstin || undefined };
      if(!payee.panOnFile){
        payload.payeeType = payeeType();
        if(payeeType() === 'person'){ payload.payeeFirstName = $('payeeFirst').value.trim(); payload.payeeLastName = $('payeeLast').value.trim(); }
      }
      if(!payee.panOnFile && $('payeePan').value.trim()){
        // The PAN card first, then everything together.
        const file = $('payeePanFile').files[0];
        let url;
        try{
          const { upload } = await import('https://esm.sh/@vercel/blob/client');
          const r = await upload(file.name, file, { access: 'public', handleUploadUrl: (window.AERVA_API || 'https://aerva-in.vercel.app') + '/api/blob-upload',
            clientPayload: JSON.stringify({ purpose: 'aadhaar-verification', token }) });
          url = r.url;
        }catch(e){ return done('The PAN card could not be uploaded. Please try again.'); }
        Object.assign(payload, { panNumber: $('payeePan').value.trim().toUpperCase(), panName: name, panDocumentUrl: url });
      }
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(payload) });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) return done(data.error || 'Something went wrong. Please try again.');
      if(data.bankCheck === 'checking') setTimeout(load, 20000);
      await load();
      const note = $('bankNote');
      if(note && data.bankCheck === 'checking') note.textContent = 'Saved. Checking with your bank — this usually takes a minute.';
    }catch(err){ done('Something went wrong. Please try again.'); }
  }

  // ---- A co-host's own payout details (their share of what they help earn) ----
  // Separate from a host's own: a person can be both. Saved with
  // savePayoutProfile; the PAN is optional, as for a host.
  async function loadCohostPayout(){
    const box = $('coBox'); if(!box) return false;
    let hosts = [], prof = null;
    try{
      const [a, b] = await Promise.all([
        fetch(API + '?myCohosting=1', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => ({})),
        fetch(API + '?myPayoutProfile=1', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => ({}))
      ]);
      hosts = (a && a.cohosting) || []; prof = (b && b.profile) || null;
    }catch(e){ return false; }
    if(!hosts.length && !prof) { box.innerHTML = ''; return false; }
    const st = prof ? prof.status : 'not_submitted';
    const cls = st === 'approved' ? 'status-approved' : st === 'rejected' ? 'status-rejected' : st === 'pending_review' ? 'status-pending' : '';
    const label = { approved: 'Verified', rejected: 'Needs attention', pending_review: 'Being verified', not_submitted: 'Not added' }[st] || 'Not added';
    const name = (prof && (prof.panName || prof.accountHolderName)) || '';
    const words = name.trim().split(/\s+/).filter(Boolean);
    box.innerHTML = `
      <div class="card">
        <h2>As a co-host</h2>
        <p class="note" style="margin:0 0 12px;">Where your own share is paid, for the listings you co-host${hosts.length ? ' for ' + esc(hosts.map(h => h.hostName).join(', ')) : ''}. Enter your name exactly as your bank account holds it. If you add a PAN, it must be in that same name.</p>
        <div class="row">
          <div><div class="row-label">Payout name</div><div class="row-value">${name ? esc(name) : 'Not added yet'}</div></div>
          ${prof && prof.panMasked ? `<div style="text-align:right;"><div class="row-label">PAN</div><div class="row-value">${esc(prof.panMasked)}</div></div>` : ''}
        </div>
        <div class="row">
          <div><div class="row-label">Bank account</div><div class="row-value">${prof && prof.accountMasked ? esc(prof.accountMasked) + (prof.ifsc ? ' · ' + esc(prof.ifsc) : '') : 'No bank details on file yet.'}</div></div>
          <span class="status ${cls}">${esc(label)}</span>
        </div>
        ${prof && prof.rejectionReason ? `<p class="note bad">${esc(prof.rejectionReason)}</p>` : ''}
        ${prof && prof.bankCheck && prof.bankCheck.message && st !== 'rejected' ? `<p class="note">${esc(prof.bankCheck.message)}</p>` : ''}
        ${prof && prof.payoutsFrom ? `<p class="note">Details changed recently: payouts resume from ${esc(new Date(prof.payoutsFrom).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}.</p>` : ''}
        ${hosts.length ? `<div class="actions" style="margin-top:14px;"><button type="button" class="btn-line" id="coEditBtn">${prof ? 'Change payout details' : 'Add payout details'}</button></div>
        <div id="coForm" style="display:none; margin-top:14px; padding-top:14px; border-top:1px solid #f0e9df;">
          <div class="warn">Changing these details puts your payouts on hold until the new account is verified, and for at least 48 hours.</div>
          <div class="two">
            <div class="field"><label for="coFirst">First name <span class="opt">(and middle name)</span></label><input type="text" id="coFirst" autocomplete="given-name" value="${esc(words.slice(0, -1).join(' '))}" placeholder="As the bank account holds it"></div>
            <div class="field"><label for="coLast">Last name <span class="opt">(surname)</span></label><input type="text" id="coLast" autocomplete="family-name" value="${esc(words.slice(-1)[0] || '')}" placeholder="As the bank account holds it"></div>
          </div>
          <div class="field"><label for="coPan">PAN <span class="opt">(optional: 0.1% TDS with it, 5% without)</span></label><input type="text" id="coPan" maxlength="10" autocomplete="off" style="text-transform:uppercase;" placeholder="e.g. ABCPS1234K"></div>
          <div class="field"><label for="coAccount">Bank account number</label><input type="text" id="coAccount" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label for="coAccount2">Re-enter account number</label><input type="text" id="coAccount2" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label for="coIfsc">IFSC code</label><input type="text" id="coIfsc" autocomplete="off" placeholder="e.g. HDFC0001234"></div>
          <div class="field"><label for="coGstin">GSTIN <span class="opt">(only with a PAN, for an account in a trading name)</span></label><input type="text" id="coGstin" maxlength="15" autocomplete="off" style="text-transform:uppercase;"></div>
          <div class="actions"><button type="button" class="btn-solid" id="coSave">Save</button><button type="button" class="btn-line" id="coCancel">Cancel</button></div>
          <p class="msg" id="coMsg"></p>
        </div>` : ''}
      </div>`;
    if(!hosts.length) return true;
    const f = $('coForm');
    $('coEditBtn').addEventListener('click', () => { f.style.display = f.style.display === 'block' ? 'none' : 'block'; });
    $('coCancel').addEventListener('click', () => { f.style.display = 'none'; });
    const coBank = window.AervaBankFields ? window.AervaBankFields.wire({ holder: $('coLast'), account: $('coAccount'), account2: $('coAccount2'), ifsc: $('coIfsc'), gstin: $('coGstin'), save: $('coSave') }) : null;
    $('coPan').addEventListener('input', () => { $('coPan').value = $('coPan').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10); });
    $('coSave').addEventListener('click', async () => {
      const msg = $('coMsg'); const bad = (t) => { msg.textContent = t; msg.style.color = '#a3402f'; };
      msg.textContent = '';
      if(coBank && !coBank.valid()) return bad('Please correct the fields marked in red.');
      const first = $('coFirst').value.replace(/\s+/g, ' ').trim(), last = $('coLast').value.replace(/\s+/g, ' ').trim();
      const pan = $('coPan').value.trim().toUpperCase();
      if(!first || !last) return bad('Enter your first and last name exactly as your bank account holds them.');
      if(pan && (!PAN_RE.test(pan) || !panFits(pan, 'person', last, ''))) return bad(NO_MATCH);
      const nm = first + ' ' + last;
      if(!confirm('Save these payout details? Your share will be paid to ' + nm + ' once the account is verified.')) return;
      $('coSave').disabled = true;
      try{
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ savePayoutProfile: { pan, panName: nm, accountHolderName: nm, payeeLastName: last, gstin: $('coGstin').value.trim(),
            accountNumber: $('coAccount').value.trim(), accountNumberConfirm: $('coAccount2').value.trim(), ifsc: $('coIfsc').value.trim() } }) });
        const d = await r.json().catch(() => ({}));
        if(!r.ok){ bad(d.error || 'Could not save your payout details.'); if(coBank) coBank.refresh(); else $('coSave').disabled = false; return; }
        await loadCohostPayout();
      }catch(e){ bad('Something went wrong. Please try again.'); $('coSave').disabled = false; }
    });
    return true;
  }

  // Payouts sent to this account (as host or co-host). Each opens its
  // summary: index.html?payout=<id>.
  async function loadSent(){
    const box = document.getElementById('sentBox');
    if(!box) return;
    try{
      const res = await fetch(API + '?myPayouts=1', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      const list = (res.ok && data.payouts) || [];
      box.innerHTML = '<div class="card"><h2>Payouts sent</h2>' + (list.length
        ? list.map(p => `<a class="payout" href="index.html?payout=${Number(p.id)}">
            <span><strong>${inr(p.amount)}</strong>${p.mine ? (p.as === 'cohost' ? ' · to you, as co-host' : ' · to you') : ' · to ' + esc(p.payeeName || (p.as === 'cohost' ? 'co-host' : 'host'))}<br><span class="sub">${p.kind === 'deposit' ? 'Security deposit compensation · ' : ''}${esc(p.listing || '')} · ${esc(day(p.arrival))} – ${esc(day(p.departure))}</span></span>
            <span class="when">Sent ${esc(day(p.sentAt))}${p.arrivingBy ? '<br>Arriving by ' + esc(day(p.arrivingBy)) : ''}</span></a>`).join('')
        : '<p class="empty">No payouts yet. Each one appears here once it is sent.</p>') + '</div>';
    }catch(err){ /* leave the page as it is */ }
  }

  load();
})();
</script>
