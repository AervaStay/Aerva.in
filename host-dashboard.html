<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Listings — Aerva</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{font-family:'Jost', sans-serif; background:#f4ebe3; color:#1c1a17; margin:0; padding:40px 20px; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto;}
  .back-home{
    display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:#1c1a17; opacity:0.6; text-decoration:none; margin-bottom:20px;
  }
  .back-home:hover{opacity:1;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}
  h1{font-family:Georgia,serif; font-size:26px; margin:0;}
  .host-email{font-size:13px; opacity:0.6;}
  .host-badge{
    display:inline-block; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:#8a6c39; border:1px solid #ddc9a3; background:#faf3e6; padding:3px 9px; border-radius:3px;
    margin-left:8px; vertical-align:middle;
  }
  .logout-btn{background:none; border:1px solid #ddd0bc; padding:8px 16px; font-size:12px; cursor:pointer; color:#1c1a17;}
  .add-listing-link{
    display:inline-block; background:#1c1a17; color:#f4ebe3; padding:12px 24px;
    text-decoration:none; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:30px;
  }
  .listing-card{background:white; border:1px solid #e0d5c0; padding:20px; margin-bottom:14px; display:flex; gap:16px; align-items:center;}
  .listing-thumb{width:70px; height:70px; object-fit:cover; border-radius:4px; background:#ebdecd; flex:0 0 auto;}
  .listing-thumb-placeholder{
    width:70px; height:70px; border-radius:4px; background:#ebdecd; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:24px; opacity:0.5;
  }
  .listing-info{flex:1; min-width:0;}
  .listing-info h3{margin:0 0 4px; font-size:16px; font-family:Georgia,serif;}
  .listing-meta{font-size:13px; opacity:0.65;}
  .status-badge{font-size:11px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;}
  .status-approved{background:#e3f0e5; color:#3a7d44;}
  .status-pending{background:#f5ecd7; color:#8a6c39;}
  .status-rejected{background:#f5e0da; color:#a3402f;}
  .status-draft{background:#e6e6e6; color:#555;}
  .status-paid{background:#e3f0e5; color:#3a7d44;}
  .status-refunded{background:#f5ecd7; color:#8a6c39;}
  .status-cancelled{background:#f5e0da; color:#a3402f;}
  .manage-link{font-size:12.5px; color:#8a6c39; text-decoration:underline; white-space:nowrap;}
  .empty{text-align:center; opacity:0.6; padding:60px 0;}
  .loading{text-align:center; opacity:0.6; padding:60px 0;}
  .section-heading{font-family:Georgia,serif; font-size:19px; margin:36px 0 14px;}
  .booking-row{background:white; border:1px solid #e0d5c0; padding:16px 20px; margin-bottom:10px;}
  .booking-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .booking-top h4{margin:0; font-size:14.5px; font-family:Georgia,serif;}
  .booking-dates{font-size:12.5px; opacity:0.65;}
  .booking-figures{display:flex; gap:24px; flex-wrap:wrap; font-size:12.5px; margin-top:8px;}
  .booking-figures .figure-label{opacity:0.55; text-transform:uppercase; letter-spacing:0.05em; font-size:10px; display:block; margin-bottom:2px;}
  .booking-figures .figure-value{font-size:14px;}
  .payout-value{color:#3a7d44; font-weight:600;}
  .deposit-row{margin-top:12px; padding-top:12px; border-top:1px solid #f0e6d6;}
  .deposit-status-badge{font-size:10.5px; padding:3px 9px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em; margin-left:8px;}
  .deposit-status-held{background:#f5ecd7; color:#8a6c39;}
  .deposit-status-disputed{background:#f5e0da; color:#a3402f;}
  .deposit-status-refunded{background:#e3f0e5; color:#3a7d44;}
  .deposit-status-resolved{background:#e3f0e5; color:#3a7d44;}
  .dispute-btn{
    background:none; border:1px solid #a3402f; color:#a3402f; padding:6px 14px;
    font-size:11.5px; cursor:pointer; margin-top:8px;
  }
  .dispute-form{margin-top:10px; display:none;}
  .dispute-form textarea{
    width:100%; box-sizing:border-box; border:1px solid #ddd0bc; padding:8px 10px;
    font-family:'Jost', sans-serif; font-size:13px; resize:vertical; margin-bottom:8px;
  }
  .dispute-note{font-size:12px; opacity:0.65; margin-top:6px;}
  .dispute-reason-shown{font-size:12.5px; opacity:0.75; margin-top:6px; font-style:italic;}
  .verify-box{background:#faf3e6; border:1px solid #ddc9a3; padding:18px 20px; margin-bottom:24px; border-radius:4px;}
  .verify-box h3{margin:0 0 4px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#8a6c39;}
  .verify-step{border-top:1px solid #e6d5b8; padding:14px 0;}
  .verify-step:first-of-type{border-top:none;}
  .verify-step-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .verify-step-head strong{font-size:14px;}
  .verify-status{font-size:10.5px; padding:2px 8px; border-radius:3px; text-transform:uppercase; letter-spacing:0.04em;}
  .verify-status-not_submitted{background:#e6e6e6; color:#555;}
  .verify-status-pending_review{background:#f5ecd7; color:#8a6c39;}
  .verify-status-verified{background:#e3f0e5; color:#3a7d44;}
  .verify-status-rejected{background:#f5e0da; color:#a3402f;}
  .verify-box input{
    background:white; border:1px solid #ddd0bc; padding:9px 11px; font-family:'Jost', sans-serif;
    font-size:14px; color:#1c1a17; width:100%; box-sizing:border-box; margin-bottom:8px;
  }
  .verify-box .btn-small{
    background:#1c1a17; color:#f4ebe3; border:none; padding:9px 18px; font-size:11.5px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
  }
  .verify-box .btn-small:disabled{opacity:0.5; cursor:default;}
  .verify-error{font-size:12px; color:#a3402f; margin-top:6px; display:none;}
  .verify-rejection-note{font-size:12.5px; color:#a3402f; margin-bottom:8px;}
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-home">&larr; Back to Aerva</a>
  <div class="top-row">
    <div>
      <h1>Your Listings<span class="host-badge" id="hostBadge" style="display:none;"></span></h1>
      <div class="host-email" id="hostEmailDisplay"></div>
    </div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>

  <a href="index.html#add-listing" class="add-listing-link">List a New Property</a>

  <div id="verificationSection"></div>

  <div id="listingsContainer">
    <p class="loading">Loading your listings…</p>
  </div>

  <h2 class="section-heading">Your Earnings</h2>
  <div id="bookingsContainer">
    <p class="loading">Loading your bookings…</p>
  </div>
</div>

<script>
  const API_BASE = 'https://aerva-in.vercel.app';
  // Single login — same session used across the whole site (see
  // guest-auth.js / guest-phone-auth.js). There's no separate host
  // account/session to check for anymore.
  const sessionToken = localStorage.getItem('aerva_guest_session');
  const hostEmail = localStorage.getItem('aerva_guest_email');

  if(!sessionToken){
    window.location.href = 'guest-login.html';
  }

  document.getElementById('hostEmailDisplay').textContent = hostEmail || '';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('aerva_guest_session');
    localStorage.removeItem('aerva_guest_email');
    localStorage.removeItem('aerva_guest_name');
    window.location.href = 'guest-login.html';
  });

  function statusBadgeHtml(status){
    return `<span class="status-badge status-${status}">${status}</span>`;
  }

  function renderListings(listings){
    const container = document.getElementById('listingsContainer');
    if(!listings.length){
      container.innerHTML = '<p class="empty">You haven\'t listed a property yet.</p>';
      return;
    }
    container.innerHTML = listings.map(l => {
      // Cover choice leads if set, otherwise interior, matching the same
      // convention used on the live site's Suites cards.
      const interiorPhotos = Array.isArray(l.interior_photo_urls) ? l.interior_photo_urls : [];
      const exteriorPhotos = Array.isArray(l.exterior_photo_urls) ? l.exterior_photo_urls : [];
      const leadPhoto = l.cover_photo_url || interiorPhotos[0] || exteriorPhotos[0];
      const thumbHtml = leadPhoto
        ? `<img class="listing-thumb" src="${leadPhoto}" alt="${l.property_name}">`
        : `<div class="listing-thumb-placeholder">${(l.property_name || '?').charAt(0).toUpperCase()}</div>`;
      const actionHref = l.status === 'draft' ? `index.html?edit=${l.id}#add-listing` : l.manageLink;
      const actionLink = l.status === 'draft'
        ? `<a class="manage-link" href="index.html?edit=${l.id}#add-listing">Continue Editing</a>`
        : `<a class="manage-link" href="${l.manageLink}">Manage Price & Offers</a>`;
      return `
        <div class="listing-card" data-href="${actionHref}" style="cursor:pointer;">
          ${thumbHtml}
          <div class="listing-info">
            <h3>${l.property_name || '(Untitled draft)'}</h3>
            <div class="listing-meta">${l.city || 'No city yet'} · ₹${l.nightly_rate || '—'}/night ${statusBadgeHtml(l.status)}</div>
          </div>
          ${actionLink}
        </div>
      `;
    }).join('');
  }

  // Shows only what's relevant to the host: what the guest paid for the
  // stay itself (subtotal + gst — this never includes the guest's own
  // separate service fee, which is Aerva's guest-side revenue and none of
  // the host's business), the commission taken out, and the resulting
  // payout. Nothing about the guest's fee appears here, by design.
  function renderBookings(bookings){
    const container = document.getElementById('bookingsContainer');
    if(!bookings.length){
      container.innerHTML = '<p class="empty">No bookings yet.</p>';
      return;
    }
    const fmt = (n) => '₹' + Number(n).toLocaleString('en-IN');
    container.innerHTML = bookings.map(b => {
      const guestPaidForStay = Number(b.subtotal) + Number(b.gst);
      const dateRange = new Date(b.arrival).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }) +
        ' – ' + new Date(b.departure).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' });

      // Deposit section — only shown at all if this booking actually had
      // one (deposit_status defaults to 'none' for bookings on listings
      // with no security deposit set). "Raise a Concern" only appears
      // while it's still 'held' and the 7-day window hasn't closed yet —
      // the same two checks the backend enforces, so a host never sees a
      // button that would just fail when clicked.
      let depositHtml = '';
      if(b.deposit_status && b.deposit_status !== 'none'){
        const releaseDate = b.deposit_release_at ? new Date(b.deposit_release_at) : null;
        const canDispute = b.deposit_status === 'held' && releaseDate && new Date() <= releaseDate;
        const releaseLabel = releaseDate
          ? releaseDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' })
          : '';

        let statusNote = '';
        if(b.deposit_status === 'held') statusNote = `Held until ${releaseLabel} unless you raise a concern.`;
        else if(b.deposit_status === 'disputed') statusNote = 'Under review by Aerva — you\'ll hear back once it\'s resolved.';
        else if(b.deposit_status === 'refunded') statusNote = 'The 7-day window passed with no concern raised — refunded to the guest in full.';
        else if(b.deposit_status === 'resolved') statusNote = `Resolved — ${fmt(b.deposit_resolution_amount || 0)} credited toward your payout, remainder refunded to the guest.`;

        depositHtml = `
          <div class="deposit-row">
            <span class="figure-label">Security Deposit</span>
            <span class="figure-value">${fmt(b.deposit_amount)}<span class="deposit-status-badge deposit-status-${b.deposit_status}">${b.deposit_status}</span></span>
            <div class="dispute-note">${statusNote}</div>
            ${b.dispute_reason ? `<div class="dispute-reason-shown">Your note: "${b.dispute_reason}"</div>` : ''}
            ${canDispute ? `
              <button type="button" class="dispute-btn" data-order-id="${b.id}" onclick="toggleDisputeForm(${b.id})">Raise a Concern</button>
              <div class="dispute-form" id="disputeForm-${b.id}">
                <textarea id="disputeReason-${b.id}" rows="3" placeholder="What happened? (damage, missing items, extra cleaning needed, etc.)"></textarea>
                <button type="button" class="btn-small" onclick="submitDispute(${b.id})">Submit</button>
                <p class="verify-error" id="disputeError-${b.id}"></p>
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        <div class="booking-row">
          <div class="booking-top">
            <h4>${b.suite_name}</h4>
            ${statusBadgeHtml(b.status)}
          </div>
          <div class="booking-dates">${dateRange} · ${b.nights} night${b.nights === 1 ? '' : 's'}</div>
          <div class="booking-figures">
            <div><span class="figure-label">Guest Paid (Stay)</span><span class="figure-value">${fmt(guestPaidForStay)}</span></div>
            <div><span class="figure-label">Commission (${b.commission_rate}%)</span><span class="figure-value">− ${fmt(b.commission_amount)}</span></div>
            <div><span class="figure-label">Your Payout</span><span class="figure-value payout-value">${fmt(b.payout_amount)}</span></div>
          </div>
          ${depositHtml}
        </div>
      `;
    }).join('');
  }

  function toggleDisputeForm(orderId){
    const form = document.getElementById('disputeForm-' + orderId);
    if(form) form.style.display = form.style.display === 'block' ? 'none' : 'block';
  }

  async function submitDispute(orderId){
    const reasonEl = document.getElementById('disputeReason-' + orderId);
    const errorEl = document.getElementById('disputeError-' + orderId);
    errorEl.style.display = 'none';
    const reason = reasonEl.value.trim();
    if(!reason){
      errorEl.textContent = 'Please describe the concern first.';
      errorEl.style.display = 'block';
      return;
    }
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
        body: JSON.stringify({ raiseDispute: { orderId, reason } })
      });
      const data = await res.json();
      if(res.ok){
        loadListings();
      } else {
        errorEl.textContent = data.error || 'Could not submit your concern. Please try again.';
        errorEl.style.display = 'block';
      }
    } catch(err){
      errorEl.textContent = 'Could not submit your concern. Please try again.';
      errorEl.style.display = 'block';
    }
  }

  function renderVerification(v){
    const container = document.getElementById('verificationSection');
    if(!v){
      container.innerHTML = '';
      return;
    }

    // 'verified' is the underlying status value (unchanged in the
    // database/API), but shown to hosts as "Approved" — friendlier
    // wording for something that's granted automatically on submission.
    const statusLabel = (status) => status === 'verified' ? 'Approved' : status.replace('_', ' ');

    const aadhaarDone = v.aadhaarStatus === 'verified' || v.aadhaarStatus === 'pending_review';
    const bankDone = v.bankStatus === 'verified' || v.bankStatus === 'pending_review';

    container.innerHTML = `
      <div class="verify-box">
        <h3>Before your first payout</h3>

        <div class="verify-step">
          <div class="verify-step-head">
            <strong>Step 1: Aadhaar Verification</strong>
            <span class="verify-status verify-status-${v.aadhaarStatus}">${statusLabel(v.aadhaarStatus)}</span>
          </div>
          ${v.aadhaarStatus === 'rejected' && v.aadhaarRejectionReason ? `<p class="verify-rejection-note">${v.aadhaarRejectionReason}</p>` : ''}
          ${aadhaarDone ? `<p style="font-size:12.5px; opacity:0.7; margin:0;">Approved — nothing more needed.</p>` : `
            <input type="file" id="aadhaarFileInput" accept="image/*,.pdf">
            <button type="button" class="btn-small" id="submitAadhaarBtn">Submit Document</button>
            <p class="verify-error" id="aadhaarError"></p>
          `}
        </div>

        <div class="verify-step">
          <div class="verify-step-head">
            <strong>Step 2: Bank Account Verification</strong>
            <span class="verify-status verify-status-${v.bankStatus}">${statusLabel(v.bankStatus)}</span>
          </div>
          ${v.bankStatus === 'rejected' && v.bankRejectionReason ? `<p class="verify-rejection-note">${v.bankRejectionReason}</p>` : ''}
          ${bankDone ? `<p style="font-size:12.5px; opacity:0.7; margin:0;">Approved — account ending ${v.bankAccountNumberMasked ? v.bankAccountNumberMasked.slice(-4) : ''}.</p>` : `
            <input type="text" id="bankHolderInput" placeholder="Account holder name">
            <input type="text" id="bankAccountInput" placeholder="Bank account number">
            <input type="text" id="bankIfscInput" placeholder="IFSC code">
            <button type="button" class="btn-small" id="submitBankBtn">Submit Bank Details</button>
            <p class="verify-error" id="bankError"></p>
          `}
        </div>

        <p style="margin:14px 0 0; font-size:12px; opacity:0.65;">Payouts are held until both steps show Verified.</p>
      </div>
    `;

    const aadhaarBtn = document.getElementById('submitAadhaarBtn');
    if(aadhaarBtn){
      aadhaarBtn.addEventListener('click', async function(){
        const fileInput = document.getElementById('aadhaarFileInput');
        const errorEl = document.getElementById('aadhaarError');
        errorEl.style.display = 'none';
        const file = fileInput.files[0];
        if(!file){
          errorEl.textContent = 'Please choose a file first.';
          errorEl.style.display = 'block';
          return;
        }
        this.disabled = true;
        this.textContent = 'Uploading…';
        try{
          const { upload } = await import('https://esm.sh/@vercel/blob/client');
          const result = await upload(file.name, file, {
            access: 'public',
            handleUploadUrl: API_BASE + '/api/blob-upload',
            clientPayload: 'aadhaar-verification'
          });
          const res = await fetch(API_BASE + '/api/host-listings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
            body: JSON.stringify({ aadhaarDocumentUrl: result.url })
          });
          const data = await res.json();
          if(res.ok){
            loadListings();
          } else {
            errorEl.textContent = data.error || 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
            this.disabled = false;
            this.textContent = 'Submit Document';
          }
        } catch(err){
          errorEl.textContent = 'Upload failed. Please try again.';
          errorEl.style.display = 'block';
          this.disabled = false;
          this.textContent = 'Submit Document';
        }
      });
    }

    const bankBtn = document.getElementById('submitBankBtn');
    if(bankBtn){
      bankBtn.addEventListener('click', async function(){
        const errorEl = document.getElementById('bankError');
        errorEl.style.display = 'none';
        const bankAccountHolderName = document.getElementById('bankHolderInput').value.trim();
        const bankAccountNumber = document.getElementById('bankAccountInput').value.trim();
        const bankIfsc = document.getElementById('bankIfscInput').value.trim();
        if(!bankAccountHolderName || !bankAccountNumber || !bankIfsc){
          errorEl.textContent = 'Please fill in all three fields.';
          errorEl.style.display = 'block';
          return;
        }
        this.disabled = true;
        this.textContent = 'Saving…';
        try{
          const res = await fetch(API_BASE + '/api/host-listings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
            body: JSON.stringify({ bankAccountHolderName, bankAccountNumber, bankIfsc })
          });
          const data = await res.json();
          if(res.ok){
            loadListings();
          } else {
            errorEl.textContent = data.error || 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
            this.disabled = false;
            this.textContent = 'Submit Bank Details';
          }
        } catch(err){
          errorEl.textContent = 'Something went wrong. Please try again.';
          errorEl.style.display = 'block';
          this.disabled = false;
          this.textContent = 'Submit Bank Details';
        }
      });
    }
  }

  async function loadListings(){
    try{
      const res = await fetch(API_BASE + '/api/host-listings', {
        headers: { 'Authorization': 'Bearer ' + sessionToken }
      });
      if(res.status === 401){
        localStorage.removeItem('aerva_guest_session');
        localStorage.removeItem('aerva_guest_email');
        localStorage.removeItem('aerva_guest_name');
        window.location.href = 'guest-login.html';
        return;
      }
      const data = await res.json();
      if(data.hostBadge){
        const badgeEl = document.getElementById('hostBadge');
        badgeEl.textContent = data.hostBadge;
        badgeEl.style.display = 'inline-block';
      }
      renderListings(data.listings || []);
      renderBookings(data.bookings || []);
      renderVerification(data.verification);
    } catch(err){
      document.getElementById('listingsContainer').innerHTML = '<p class="empty">Could not load your listings. Please refresh.</p>';
      document.getElementById('bookingsContainer').innerHTML = '<p class="empty">Could not load your bookings. Please refresh.</p>';
    }
  }

  // Whole-card click: anywhere on the card jumps to its own action link's
  // destination — except the link itself, which already navigates and
  // would otherwise double-trigger.
  document.getElementById('listingsContainer').addEventListener('click', (e) => {
    if(e.target.closest('a.manage-link')) return;
    const card = e.target.closest('.listing-card');
    if(!card || !card.dataset.href) return;
    window.location.href = card.dataset.href;
  });

  if(sessionToken){
    loadListings();
  }
</script>

</body>
</html>
